// =============================================================================
//  TEXTOS DE CIENCIA de Elara y Titanus (los de Termos, Tyrna y Karmen están en Termos/Ciencia.cfg)
//  Claves: <Cuerpo><Situación>[<Bioma sin espacios>]. validar_pack.py comprueba los biomas.
// =============================================================================
@EXPERIMENT_DEFINITION[crewReport]:FOR[MundosLejanos]
{
	@RESULTS
	{
		ElaraInSpaceHigh = Una estrella naranja, más pequeña y suave que Kerbol. Se puede mirar casi de frente sin que duela.
		ElaraInSpaceLow = Manchas oscuras salpican la superficie naranja. Los filtros apenas tienen que trabajar.
		TitanusInSpaceHigh = Un disco color crema con bandas pardas, perdido en medio de unos anillos que parecen no acabar nunca.
		TitanusInSpaceLow = Los anillos tapan media galaxia. El lado nocturno de Titanus no está negro: brilla con un rojo muy apagado.
		TitanusFlyingHigh = Las nubes de agua son espesas como natillas. La nave pesa veintiuna veces más de lo normal y cada estructura cruje.
		TitanusFlyingLow = El aire es tan denso como un líquido y está al rojo: 700 K. Abajo, un mar pardo que no termina de ser ni agua ni vapor.
		TitanusSrfSplashed = No hay superficie clara: la niebla se vuelve fluido poco a poco. Sea lo que sea, nos está hundiendo.
		TitanusSrfSplashedBalsasMinerales = Alrededor flotan islas de espuma de roca, porosas como piedra pómez y del tamaño de montañas.
		TitanusSrfSplashedJardinesQuimicos = Las balsas cercanas tienen manchas verdes y naranjas que cambian de forma de una hora a otra.
		TitanusSrfLanded = Pisamos espuma de roca que cruje y suelta burbujas de hidrógeno. Toda la balsa sube y baja con el mar.
		TitanusSrfLandedJardinesQuimicos = Costras verdes y naranjas forman figuras ramificadas que se repiten. Juraría que han crecido desde que aterrizamos.
	}
}

@EXPERIMENT_DEFINITION[evaReport]:FOR[MundosLejanos]
{
	@RESULTS
	{
		TitanusSrfLanded = El kerbal no puede ni levantar la cabeza: 21 g. Telemetría dice que sigue consciente. Por poco.
		TitanusSrfSplashed = El traje marca 218 atmósferas y 427 °C. El control de misión pide volver a la cápsula ya mismo.
		TitanusInSpaceLow = Desde el traje, los anillos parecen un suelo infinito y blanco que corta el cielo en dos.
	}
}

@EXPERIMENT_DEFINITION[surfaceSample]:FOR[MundosLejanos]
{
	@RESULTS
	{
		TitanusSrfLanded = Espuma de sílice y sales de magnesio, llena de burbujas de hidrógeno. Su densidad es de 0.12 g/cm³: flota hasta en agua supercrítica.
		TitanusSrfLandedBalsasMinerales = La espuma tiene capas, como un pastel: cada una precipitó en una corriente distinta mientras la balsa iba a la deriva.
		TitanusSrfLandedJardinesQuimicos = Las costras de colores son redes de compuestos de silicio y azufre que catalizan su propia formación con el hidrógeno y los minerales disueltos. Crecen, se parten y cada trozo sigue creciendo. ¿Vida? Nadie se atreve a decirlo aún.
		TitanusSrfSplashed = Agua supercrítica con sílice, magnesio y hierro disueltos. Al enfriarse en el frasco, los minerales precipitan de golpe.
		TitanusSrfSplashedDorsalesdeDisolucion = El agua de aquí es la más cargada de minerales: debajo, el mar se come las crestas del manto.
	}
}

@EXPERIMENT_DEFINITION[temperatureScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		ElaraInSpaceLow = La fotosfera ronda los 4 600 K, unos 1 200 menos que Kerbol: por eso su luz es naranja.
		TitanusSrfSplashed = 700 K en la superficie del mar: 53 grados por encima del punto crítico del agua.
		TitanusSrfLanded = 700 K. Elara no calienta casi nada a esta distancia: todo el calor sale del interior de Titanus, que aún se contrae.
		TitanusFlyingHigh = En la cima de las nubes hay 160 K. Por debajo, la temperatura sube sin parar hasta el mar.
	}
}

@EXPERIMENT_DEFINITION[barometerScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		TitanusSrfSplashed = 218 atmósferas: la presión crítica del agua. Por encima de este punto, líquido y vapor dejan de distinguirse.
		TitanusFlyingLow = La presión sube tan deprisa al bajar que se nota en cada segundo de descenso: con 21 g, la atmósfera se aplasta contra el planeta.
	}
}

@EXPERIMENT_DEFINITION[seismicScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		TitanusSrfLanded = Nada de terremotos: solo el balanceo lento de la balsa y, muy de vez en cuando, el crujido de un trozo de espuma que se desprende.
	}
}

@EXPERIMENT_DEFINITION[gravityScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		ElaraInSpaceLow = 0.70 masas de Kerbol. Una enana naranja tranquila: vivirá varias veces más que Kerbol.
		TitanusInSpaceLow = Doce masas jovianas en solo 1.2 radios jovianos. Un poco más y habría encendido el deuterio: es casi una enana marrón.
		TitanusInSpaceHigh = Las órbitas de los anillos tienen huecos en las resonancias con lo que fueron sus lunas. Titanus se las tragó todas.
		TitanusSrfLanded = 21 g. Para llegar a órbita hacen falta más de 40 km/s de delta-v: el pozo gravitatorio más hondo del pack.
	}
}
