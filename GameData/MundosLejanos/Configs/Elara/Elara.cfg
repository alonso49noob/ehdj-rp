// =============================================================================
//  ELARA — enana naranja K4 V (4 600 K) a 0.3 años luz kerbales (~19 000 KAU), al otro lado del cielo que Kraken
//  Escalada respecto a Kerbol como una K4 V real respecto al Sol: 0.70 masas (mu = 8.206e17) y 0.70 radios.
//  Luz: L = 0.70² · (4 600 / 5 772)⁴ = 0.20 L_Kerbol. Kopernicus mide `luminosity` en W/m² a 1 KAU
//  (Kerbol = 1360) -> 268.8. Termos, a 3 KAU, recibe 30 W/m²; Titanus, a 6.5 KAU, 6 W/m².
//  SOI fijada a mano (2 000 KAU): la de Laplace no vale para una estrella de masa parecida a la de Kerbol.
// =============================================================================
@Kopernicus:FOR[MundosLejanos]
{
	Body
	{
		name = Elara
		Template
		{
			name = Sun
		}
		Properties
		{
			displayName = Elara^N
			description = Una enana naranja, algo más pequeña y fría que Kerbol, a 0.3 años luz kerbales: unas 19 000 veces la distancia entre Kerbin y Kerbol, en el lado del cielo opuesto a Kraken. Su luz es cálida, del color de una brasa viva, y cinco veces más débil que la de Kerbol. Es tranquila y vivirá muchísimo más que él. Su sistema casi está vacío: Titanus, un gigante de doce masas jovianas, migró hacia dentro, se tragó o expulsó casi todo lo que la orbitaba y convirtió los restos en un sistema de anillos inmenso. Solo Termos, en la órbita interior, sobrevivió.
			radius = 183120000
			geeASL = 2.4954950981446697
			sphereOfInfluence = 27199680512000
			rotationPeriod = 2700000
			tidallyLocked = false
			initialRotation = 0
			isHomeWorld = false
			timewarpAltitudeLimits = 0 2100000 2100000 4200000 8400000 16800000 33600000 42000000
			ScienceValues
			{
				inSpaceLowDataValue = 12
				inSpaceHighDataValue = 9
				recoveryValue = 18
				spaceAltitudeThreshold = 700000000
			}
		}
		Orbit
		{
			referenceBody = Sun
			semiMajorAxis = 258020563445218.7	// 0.3 años luz kerbales (1 kly = 63 241 KAU)
			eccentricity = 0
			inclination = 9
			longitudeOfAscendingNode = 125
			argumentOfPeriapsis = 0
			meanAnomalyAtEpoch = 4.3
			epoch = 0
			color = 1.0,0.66,0.36,1
		}
		ScaledVersion
		{
			type = Star
			Material
			{
				// Fotosfera naranja con manchas: el shader de estrella de Kerbol, en tonos de K4
				emitColor0 = 1.0,0.55,0.22,1
				emitColor1 = 1.0,0.72,0.42,1
				sunspotPower = 1.4
				sunspotColor = 0.45,0.14,0.04,1
				rimColor = 1.0,0.50,0.20,1
				rimPower = 0.6
				rimBlend = 1.3
			}
			Light
			{
				givesOffLight = true
				luminosity = 268.8196587448746
				sunAU = 13599840256
				sunlightColor = 1.0,0.80,0.62,1
				sunlightIntensity = 0.8
				scaledSunlightColor = 1.0,0.80,0.62,1
				scaledSunlightIntensity = 0.8
				IVASunColor = 1.0,0.78,0.58,1
				IVASunIntensity = 0.8
				sunLensFlareColor = 0.60,0.38,0.22,1
				ambientLightColor = 0.04,0.03,0.025,1
				// Intensidad de la luz local según la distancia: Termos a 4.1e10 m, Titanus a 8.8e10 m
				IntensityCurve
				{
					key = 0 1 0 0
					key = 40000000000 0.9 0 0
					key = 100000000000 0.75 0 0
					key = 400000000000 0 0 0
				}
				ScaledIntensityCurve
				{
					key = 0 1 0 0
					key = 6666667 0.9 0 0
					key = 16666667 0.75 0 0
					key = 66666667 0 0 0
				}
				IVAIntensityCurve
				{
					key = 0 0.9 0 0
					key = 40000000000 0.8 0 0
					key = 100000000000 0.65 0 0
					key = 400000000000 0 0 0
				}
			}
		}
	}
}
