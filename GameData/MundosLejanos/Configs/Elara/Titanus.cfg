// =============================================================================
//  TITANUS — sub-enana marrón de 12 masas jovianas que se tragó casi todo el sistema de Elara
//  1.2 radios de Jool (7 200 km). Gravedad del análogo real (12 M_J en 1.2 R_J): 207 m/s² = 21 g.
//  En unidades de KSP son ~38 masas de Jool (mu = 1.068e16), el 1.3 % de Elara. A 6.5 KAU de Elara.
//  Océano de agua supercrítica bajo 218 atm de H2/He/H2O a 700 K (punto crítico del agua: 647 K, 218 atm).
//  El agua disuelve el manto; los minerales precipitan como espuma llena de hidrógeno, más ligera que el agua
//  supercrítica (~0.2 g/cm³), y forman balsas flotantes (scatters de Parallax con modelos propios:
//  herramientas/generar_modelos.py -> Modelos/Titanus). El fondo está a 18–179 km (20× la primera versión).
//  Anillos de 1.6 a 80 radios (11 500–576 000 km): los restos de todo lo que se tragó.
// =============================================================================
@Kopernicus:FOR[MundosLejanos]
{
