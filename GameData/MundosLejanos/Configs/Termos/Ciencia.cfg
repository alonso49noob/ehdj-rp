// =============================================================================
//  TEXTOS DE CIENCIA de Termos, Tyrna y Karmen
//  Claves: <Cuerpo><Situación>[<Bioma sin espacios>]. validar_pack.py comprueba los biomas.
// =============================================================================
@EXPERIMENT_DEFINITION[crewReport]:FOR[MundosLejanos]
{
	@RESULTS
	{
		TermosInSpaceHigh = Un mundo pequeño y nublado, gris azulado. Entre las nubes asoman lagos de un turquesa lechoso y, en el ecuador, manchas oscuras de lava.
		TermosInSpaceLow = Por debajo de las nubes se ven los lagos, enormes para un cuerpo tan pequeño, rodeados de anillos blancos. En los trópicos suben penachos de vapor y humo.
		TermosFlyingHigh = El cielo es blanco azulado y el aire, espeso. Las nubes de vapor se apilan sobre los volcanes del ecuador.
		TermosFlyingLow = El aire es tan denso que la nave flota más que vuela, y la gravedad apenas tira de ella. Sobre los lagos el vapor forma una bruma baja.
		TermosSrfLanded = Bajo un cielo blanquecino, el suelo de basalto oscuro humea. Del horizonte llega el silbido de los géiseres.
		TermosSrfSplashed = El agua está a unos 140 °C y no hierve. Es turbia y lechosa, del color de una piscina con leche.
		TermosSrfLandedOrillasdeSilice = Terrazas blancas escalonadas, como bandejas de porcelana, con franjas ocres. Por ellas baja el agua de los géiseres.
		TermosSrfLandedPozosAcidos = El paisaje más extraño del sistema: charcas amarillas, verdes y naranjas entre costras de sal blanca. El suelo burbujea.
		TermosSrfLandedCamposVolcanicos = Conos de lava negra que humean. En la caldera más cercana brilla la lava al rojo.
		TermosSrfLandedLlanurasdeArcilla = Barro verdoso y charcos tibios. Aquí llueve casi siempre: es la zona más fresca de Termos, y aun así pasa de 90 °C.
		TyrnaInSpaceHigh = Una bola de hielo blanco cruzada por grietas oscuras. Termos cuelga en el cielo, gris azulado y cubierto de nubes.
		TyrnaSrfLanded = Hielo claro salpicado de manchas grises de metal. Los fragmentos brillan cuando les da la luz.
		TyrnaSrfLandedFisurasCriovolcanicas = Al borde de una fisura: una zanja de hielo fresco y brillante con el fondo oscuro, cubierto de costras metálicas.
		KarmenInSpaceHigh = Un pedrusco metálico y anguloso. Desde aquí Termos es solo un disco pequeño y Tyrna, un punto.
		KarmenSrfLanded = Roca oscura y pesada, con brillo de metal en las aristas.
		KarmenSrfLandedCaradeFractura = Una llanura completamente plana y pulida, como un espejo de acero: es la cara por donde se partió el núcleo.
	}
}

@EXPERIMENT_DEFINITION[evaReport]:FOR[MundosLejanos]
{
	@RESULTS
	{
		TermosSrfLanded = Cinco atmósferas a 120 °C: el traje aguanta, pero el kerbal suda. Con 0.27 g cada paso es un pequeño salto.
		TermosSrfSplashed = El agua casi hirviendo empaña el visor. Mejor no quedarse mucho rato.
		TermosSrfLandedPozosAcidos = Las botas se manchan de amarillo y verde. El ácido ataca las juntas del traje: hay que volver pronto.
		TyrnaSrfLanded = Con 0.07 g, un salto dura casi medio minuto. El hielo cruje bajo las botas.
		KarmenSrfLanded = Casi no hay gravedad: un salto descuidado basta para escapar de Karmen.
	}
}

@EXPERIMENT_DEFINITION[surfaceSample]:FOR[MundosLejanos]
{
	@RESULTS
	{
		TermosSrfLanded = Basalto con minerales alterados por el agua caliente. No hay óxido rojo: sin oxígeno libre, el hierro se queda en minerales verdosos y grises.
		TermosSrfSplashed = Agua con mucha sílice y algo de amoníaco y carbonatos disueltos. Al enfriarse, la sílice precipita y forma las terrazas blancas de las orillas.
		TermosSrfLandedOrillasdeSilice = Sínter: sílice depositada capa a capa por los géiseres. Las bandas ocres son de minerales de hierro.
		TermosSrfLandedPozosAcidos = Azufre, sales de hierro y cloruros, en salmuera muy ácida y muy caliente, como en Dallol, en la Tierra. Un laboratorio de química a cielo abierto.
		TermosSrfLandedCamposVolcanicos = Lava basáltica recién solidificada, todavía caliente al tacto del brazo robótico.
		TermosSrfLandedTierrasAltas = Toba volcánica: ceniza compactada y alterada por el vapor durante millones de años.
		TermosSrfLandedLlanurasdeArcilla = Arcillas verdosas de hierro ferroso, que deja la lluvia constante de las latitudes altas.
		TyrnaSrfLanded = Hielo de agua con granos de hierro y níquel, restos de la lluvia de escombros que dejó Titanus. Muy fácil de separar: buena mena.
		TyrnaSrfLandedFisurasCriovolcanicas = Salmuera congelada cargada de sulfuros de hierro, níquel y cobre: los metales disueltos en el océano interior de Tyrna.
		KarmenSrfLanded = Hierro y níquel casi puros: el núcleo de un cuerpo que se rompió en una colisión.
		KarmenSrfLandedCaradeFractura = Cristales de hierro y níquel de varios centímetros, los que crecen cuando un núcleo se enfría durante millones de años.
	}
}

@EXPERIMENT_DEFINITION[temperatureScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		TermosSrfLanded = 120 °C en el ecuador y unos 95 °C en los polos. A esta distancia de Elara debería estar a −180 °C: el calor interno y el efecto invernadero del vapor y del CO2 lo mantienen como un termo.
		TermosSrfSplashed = 140 °C y el agua no hierve. A 5 atmósferas el agua hierve a 152 °C, así que estos lagos están siempre a punto.
		TermosSrfLandedPozosAcidos = 110 °C en la salmuera y más de 200 °C en las grietas del fondo.
		TyrnaSrfLanded = −170 °C. Junto a las fisuras activas sube a −120 °C.
		KarmenSrfLanded = −160 °C. El metal transmite tan bien el calor que la cara de sombra y la de sol casi no se diferencian.
	}
}

@EXPERIMENT_DEFINITION[barometerScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		TermosSrfLanded = 5 atm: 55 % de nitrógeno, 22 % de dióxido de carbono, 18 % de vapor de agua y 5 % de amoníaco. El aire pesa 4.5 kg por metro cúbico.
		TermosFlyingHigh = La atmósfera es muy alta para un cuerpo tan pequeño: con tan poca gravedad, se escapa poco a poco al espacio y los volcanes la reponen.
		TermosSrfSplashed = Sobre el lago el aire está saturado de vapor.
	}
}

@EXPERIMENT_DEFINITION[seismicScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		TermosSrfLanded = Temblores continuos y suaves: el interior de Termos sigue fundido. Es el planeta enano más activo que se conoce.
		TermosSrfLandedCamposVolcanicos = El sismómetro no para: el magma sube bajo los volcanes del ecuador.
		TyrnaSrfLanded = Crujidos rítmicos, uno por órbita: las mareas de Termos estiran y aprietan a Tyrna.
		KarmenSrfLanded = Silencio absoluto: Karmen es metal macizo y frío.
	}
}

@EXPERIMENT_DEFINITION[gravityScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		TermosSrfLanded = 0.27 g: mucho para un cuerpo de 426 km. Termos es denso, con un núcleo de hierro grande y todavía caliente.
		TermosInSpaceLow = Termos es lo único que queda entre Elara y Titanus. Los cráteres más jóvenes son de la época en que el gigante dispersaba todo lo demás.
		TyrnaSrfLanded = Una gravedad alta para una bola de hielo: algo pesado se esconde bajo la corteza. ¿Un núcleo metálico?
		KarmenSrfLanded = Densidad de metal macizo. Pocos asteroides pesan tanto para su tamaño.
	}
}
