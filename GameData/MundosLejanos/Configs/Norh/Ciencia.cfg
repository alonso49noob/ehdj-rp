// =============================================================================
//  TEXTOS DE CIENCIA de Norh
//  Claves: <Cuerpo><Situación>[<Bioma sin espacios>]. validar_pack.py comprueba los biomas.
// =============================================================================
@EXPERIMENT_DEFINITION[crewReport]:FOR[MundosLejanos]
{
	@RESULTS
	{
		NorhInSpaceHigh = Un disco ocre cruzado por unos anillos de hielo azulado. Por delante, a 60°, brilla Jool: Norh lo persigue por la misma órbita desde siempre. A través de la neblina se adivina una franja oscura alrededor del ecuador: el único mar líquido entre Dres y Jool.
		NorhInSpaceLow = Los anillos pasan por encima, inclinados, como un puente de hielo. Bajo la neblina asoman los conos de decenas de volcanes y, en el ecuador, una isla enorme: el Gran Volcán.
		NorhFlyingHigh = La nave atraviesa nubes de cristales de amoníaco que brillan como polvo de vidrio. El cielo es de color ocre y Kerbol, un punto débil, apenas lo ilumina.
		NorhFlyingLow = El aire es tan denso que la nave parece nadar. Las alas sustentan muchísimo, pero cada maniobra cuesta: es como volar dentro de un almíbar helado.
		NorhSrfLanded = Roca volcánica cubierta de escarcha. No hay un solo cráter a la vista: los volcanes y la atmósfera borran cualquier impacto.
		NorhSrfSplashed = El mar es agua con amoníaco a −40 °C, y sin embargo es líquido. Huele, si se pudiera oler, a limpiador industrial.
		NorhSrfLandedGranVolcan = Desde la cima del Gran Volcán se ve el mar ecuatorial abajo, a 9 km, y los anillos cruzando el cielo. El borde de la caldera humea.
		NorhSrfLandedVolcanes = Un cono joven, con lava todavía tibia bajo la costra. A −40 °C, la roca recién enfriada cruje como hielo.
		NorhSrfLandedCasquetesPolares = Hielo de agua y amoníaco hasta el horizonte. Aquí la temperatura baja de −70 °C y el mar se vuelve sólido.
		NorhSrfLandedCostasHeladas = Las olas llegan lentas y espesas, y dejan una costra de hielo de amoníaco en la arena volcánica.
	}
}

@EXPERIMENT_DEFINITION[evaReport]:FOR[MundosLejanos]
{
	@RESULTS
	{
		NorhSrfLanded = La presión, 12 veces la de Kerbin, aprieta el traje desde todos lados. Caminar cuesta, pero un paracaídas aquí casi no hace falta: el aire lo frena todo.
		NorhSrfSplashed = El kerbal flota en un mar que no se congela a −40 °C. El amoníaco funciona como el anticongelante de un motor.
		NorhSrfLandedGranVolcan = Desde la caldera se ven las capas de cien coladas apiladas. El Gran Volcán lleva millones de años creciendo.
		NorhFlyingLow = Con un kerbal fuera, la densidad del aire se nota en la cara: la ventisca de cristales de amoníaco golpea el visor como arena.
	}
}

@EXPERIMENT_DEFINITION[surfaceSample]:FOR[MundosLejanos]
{
	@RESULTS
	{
		NorhSrfLanded = Basalto con vetas de hielo de amoníaco en las grietas. Sin rastro de impactos en los minerales: esta roca tiene menos de unos pocos millones de años.
		NorhSrfSplashed = Agua con un 25 % de amoníaco. Esa mezcla no se congela hasta los −55 °C: por eso el ecuador, a −40 °C, sigue líquido.
		NorhSrfLandedVolcanes = Lava fresca, rica en volátiles. Al calentarla en el laboratorio suelta amoníaco y agua: los volcanes son los que alimentan la atmósfera.
		NorhSrfLandedCasquetesPolares = Hielo de agua con capas de hidrato de amoníaco. Cada capa marca un invierno: el registro climático de Norh.
		NorhSrfLandedTundradeAmoniaco = Escarcha de amoníaco sobre roca volcánica. Se sublima al tocarla con el guante.
		NorhSrfLandedGranVolcan = Ceniza fina de la caldera del Gran Volcán, todavía tibia. Contiene cristales de olivino del manto profundo.
	}
}

@EXPERIMENT_DEFINITION[temperatureScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		NorhSrfLanded = −40 °C en el ecuador y unos −75 °C en los polos. A 5 KAU de Kerbol, en la órbita de Jool, debería rondar los −160 °C: el hidrógeno y el nitrógeno, chocando a 12 bar, atrapan el calor.
		NorhSrfSplashed = El mar está a −40 °C y no se congela. El agua pura lo haría a 0 °C; el amoníaco baja ese punto 55 grados.
		NorhSrfLandedGranVolcan = En la caldera, el suelo marca +30 °C. Es el sitio más caliente de Norh por kilómetros a la redonda.
	}
}

@EXPERIMENT_DEFINITION[barometerScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		NorhSrfLanded = 12 bar: 45 % de nitrógeno, 23 % de hidrógeno y 32 % de amoníaco. El aire pesa 11 kg por metro cúbico, casi el doble que en Eve.
		NorhFlyingHigh = Por encima de los 30 km el aire se vuelve transparente: las nubes de amoníaco se quedan abajo, donde hace frío suficiente para condensarlo.
		NorhSrfSplashed = Sobre el mar la presión es la misma, pero el aire está saturado de amoníaco: lo que se evapora del mar vuelve a caer como lluvia.
	}
}

@EXPERIMENT_DEFINITION[seismicScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		NorhSrfLanded = Temblores continuos y suaves: el magma se mueve bajo la corteza. Norh es geológicamente joven, casi tanto como un planeta recién formado.
		NorhSrfLandedVolcanes = El suelo vibra con un zumbido grave: una cámara de magma a pocos kilómetros de profundidad.
		NorhSrfLandedGranVolcan = Bajo el Gran Volcán hay una pluma de manto que lleva millones de años en el mismo sitio, como la que forma las islas de un archipiélago.
	}
}

@EXPERIMENT_DEFINITION[gravityScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		NorhSrfLanded = Gravedad de 0.93 g. Norh tiene casi la masa de Kerbin y su mismo tamaño, pero menos hierro en el núcleo.
		NorhInSpaceLow = El campo gravitatorio es casi perfecto, sin las concentraciones de masa de los grandes cráteres. Solo destaca el Gran Volcán.
	}
}
