// =============================================================================
//  TEXTOS DE CIENCIA de Akira
//  Claves: <Cuerpo><Situación>[<Bioma sin espacios>]. validar_pack.py comprueba los biomas.
// =============================================================================
@EXPERIMENT_DEFINITION[crewReport]:FOR[MundosLejanos]
{
	@RESULTS
	{
		AkiraInSpaceHigh = Un mundo rosado y blanco envuelto en una bruma azul, con una mancha clara con forma de lágrima y una franja rojiza en el ecuador. Kerbol es una estrella más.
		AkiraInSpaceLow = El Glaciar de Celdas parece una colcha de polígonos claros. En su borde flotan bloques de hielo grandes como montañas.
		AkiraFlyingHigh = Un cielo azul muy oscuro, casi negro. Las capas de bruma se ven como velos finos por encima de la nave.
		AkiraFlyingLow = El aire es denso y helado. A lo lejos se levanta un penacho de nitrógeno que el viento tumba de lado.
		AkiraSrfLanded = Llanuras rosadas de hielo bajo un cielo azul oscuro. La luz es tan tenue que el traje enciende los focos solo.
		AkiraSrfLandedGlaciardeCeldas = El hielo de nitrógeno se ve liso, partido en celdas de varios kilómetros. Cada una se remueve, despacio, como una sopa espesa.
		AkiraSrfLandedCriovolcanes = La ladera de un criovolcán: hielo rojizo y montículos. Arriba, una fumarola expulsa nitrógeno que cae como nieve.
		AkiraSrfLandedTierrasdeTolinas = Suelo rojo oscuro con cráteres antiguos: la única parte de Akira que el hielo nuevo no ha cubierto.
		AkiraSrfLandedCrestasdeMetano = Crestas de hielo de metano afiladas como cuchillas, de cientos de metros, todas alineadas.
		AkiraSrfLandedMontanasdeHielo = Montañas de hielo de agua, duro como la roca a esta temperatura, que flotan sobre el nitrógeno como icebergs.
	}
}

@EXPERIMENT_DEFINITION[evaReport]:FOR[MundosLejanos]
{
	@RESULTS
	{
		AkiraSrfLanded = −211 °C. El traje gasta casi toda su energía en calentarse. La escarcha de nitrógeno se pega a las botas.
		AkiraSrfLandedCriovolcanes = Cae una nieve fina de nitrógeno que se sublima en cuanto toca el traje caliente.
	}
}

@EXPERIMENT_DEFINITION[surfaceSample]:FOR[MundosLejanos]
{
	@RESULTS
	{
		AkiraSrfLanded = Hielo de nitrógeno con un poco de metano y monóxido de carbono. Debajo, hielo de agua: la verdadera roca de Akira.
		AkiraSrfLandedTierrasdeTolinas = Tolinas: compuestos orgánicos que la poca luz de Kerbol fabrica en la atmósfera y que caen como polvo rojo.
		AkiraSrfLandedCrestasdeMetano = Hielo de metano casi puro: la parte del hielo que no se evapora.
		AkiraSrfLandedCriovolcanes = Hielo de agua con amoníaco, recién congelado: viene de un océano interior todavía líquido.
		AkiraSrfLandedGlaciardeCeldas = Nitrógeno sólido muy puro. Las muestras de distintas celdas tienen edades distintas: el glaciar se renueva solo.
	}
}

@EXPERIMENT_DEFINITION[temperatureScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		AkiraSrfLanded = −211 °C en el ecuador y unos −217 °C en los polos. La luz de Kerbol es 40 000 veces más débil que en Kerbin: casi todo el calor viene de dentro.
		AkiraSrfLandedCriovolcanes = −180 °C junto a la fumarola: lo más caliente que hay en 100 KAU a la redonda.
	}
}

@EXPERIMENT_DEFINITION[barometerScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		AkiraSrfLanded = 1.2 atm de nitrógeno con algo de metano y monóxido de carbono. A esta temperatura el hielo de nitrógeno no debería sostener más de 0.1 atm: algo la repone sin parar.
		AkiraFlyingHigh = La estratosfera está más caliente que el suelo: el metano absorbe la poca luz que llega, como en Plutón.
	}
}

@EXPERIMENT_DEFINITION[seismicScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		AkiraSrfLanded = Mucha actividad para un mundo tan frío: temblores frecuentes y, muy al fondo, algo que se mueve. Probablemente un océano de agua con amoníaco.
		AkiraSrfLandedCriovolcanes = El suelo vibra de forma continua: el criovolcán está en erupción.
	}
}

@EXPERIMENT_DEFINITION[gravityScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		AkiraSrfLanded = 0.2 g. Para un cuerpo de hielo de 900 km, es un mundo muy grande, pero ligero.
		AkiraInSpaceLow = Pese a su tamaño, Akira está tan lejos que su gravedad no altera las órbitas de los demás cuerpos del borde del sistema.
	}
}
