// =============================================================================
//  TEXTOS DE CIENCIA de Skolta y Ceniza
//  Claves: <Cuerpo><Situación>[<Bioma sin espacios>]. validar_pack.py comprueba los biomas.
// =============================================================================
@EXPERIMENT_DEFINITION[crewReport]:FOR[MundosLejanos]
{
	@RESULTS
	{
		SkoltaInSpaceHigh = Una bola naranja y lisa, como un melocotón. La bruma lo tapa todo: solo se adivinan manchas claras donde están las tierras altas y los casquetes polares, un poco más pálidos.
		SkoltaInSpaceLow = A través de la bruma asoman formas borrosas: un continente blanco al norte, un mar enorme y gris ámbar que refleja el cielo naranja, con un borde claro en las costas, y bandas oscuras de dunas cerca del ecuador.
		SkoltaFlyingHigh = La nave cruza la bruma naranja y, debajo, una capa continua de nubes color crema. Kerbol no se ve: solo una zona algo más clara del cielo.
		SkoltaFlyingLow = Bajo la base gris de las nubes, a 1-3 km, todo tiene un tinte ámbar y apenas hay sombras. Sobre el mar flota una niebla baja.
		SkoltaSrfLanded = Un día nublado que no termina nunca. Cielo naranja oscuro, luz ámbar sin sombras y, de vez en cuando, una llovizna fina de amoníaco.
		SkoltaSrfSplashed = El líquido es incoloro y transparente: junto a la costa se ve el fondo claro, pero mar adentro el fondo se pierde y el mar parece casi negro. La nave flota más hundida que en Kerbin: el líquido es un 25 % menos denso que el agua.
		SkoltaSrfLandedTierrasAltas = Roca blanca hasta el horizonte, con vetas verde pálido. Parece la Mun, pero con cielo naranja.
		SkoltaSrfLandedDunas = Dunas oscuras, casi negras, de arena orgánica que cayó de la bruma. Crujen bajo el tren de aterrizaje.
		SkoltaSrfSplashedBahiasAzules = El mar es azul intenso aquí: el azufre de los volcanes cercanos se disuelve en el amoníaco. Contrasta con el mar pálido del resto del planeta.
		SkoltaSrfLandedCamposVolcanicos = Conos de lava gris salpicados de manchas amarillas y naranjas. Un penacho blanco sube de la caldera más cercana.
		SkoltaSrfLandedYacimientosMetalicos = Rocas teñidas de azul y violeta intensos, lo más llamativo del planeta: cobre y níquel que reaccionan con el amoníaco.
		SkoltaSrfLandedSalinas = Una llanura blanca y plana de sales de amonio, donde el mar se retiró. Brilla incluso bajo esta luz tan débil.
		CenizaInSpaceHigh = Una roca parda y oscura con cráteres suaves. Desde aquí, Skolta es un disco naranja liso que llena medio cielo.
		CenizaSrfLanded = Polvo pardo de arcillas, fino como harina. Encima, Skolta cuelga en el cielo sin moverse, siempre en el mismo sitio.
		CenizaSrfLandedMonteSolitario = Al pie del Monte Solitario: una pared de hielo y sales de 3 km, surcada de vetas claras que bajan desde la cima como cera derretida.
	}
}

@EXPERIMENT_DEFINITION[evaReport]:FOR[MundosLejanos]
{
	@RESULTS
	{
		SkoltaSrfLanded = El aire pesa cuatro veces más que en Kerbin y es tóxico: un 21 % de amoníaco. Sin el casco, el kerbal no duraría ni un segundo.
		SkoltaSrfSplashed = El kerbal flota apenas, con el agua al cuello. Un líquido menos denso que el agua sostiene peor.
		SkoltaSrfLandedDunas = Las dunas son de partículas orgánicas que la bruma lleva millones de años dejando caer. El traje queda manchado de marrón.
		CenizaSrfLanded = Con 0.1 g, cada salto dura varios segundos. El polvo pardo tarda en volver a posarse.
	}
}

@EXPERIMENT_DEFINITION[surfaceSample]:FOR[MundosLejanos]
{
	@RESULTS
	{
		SkoltaSrfLanded = Silicatos con muy poco hierro: por eso no hay rojo de óxido en todo el planeta. El hierro descompondría la hidracina del mar.
		SkoltaSrfSplashed = Amoníaco líquido con un 10-20 % de hidracina disuelta. Si se calienta, el amoníaco hierve a −33 °C y deja hidracina casi pura: un monopropelente que solo hay que destilar.
		SkoltaSrfSplashedBahiasAzules = Amoníaco con azufre disuelto: de ahí el azul. Aquí casi no queda hidracina; el azufre y los metales la descomponen.
		SkoltaSrfLandedTierrasAltas = Anortosita: feldespato casi puro, como las tierras altas de la Mun. Las vetas verdes son olivino pobre en hierro.
		SkoltaSrfLandedDunas = Granos de tholins, compuestos orgánicos que se forman en la bruma con la luz de Kerbol y caen como nieve parda.
		SkoltaSrfLandedCamposVolcanicos = Basalto cubierto de cristales amarillos de hidrosulfuro de amonio. Los volcanes expulsan amoníaco, metano y algo de azufre: son los que mantienen la atmósfera.
		SkoltaSrfLandedYacimientosMetalicos = Minerales de cobre y níquel que forman complejos azules con el amoníaco. Valiosos, pero cerca de ellos el mar pierde la hidracina.
		SkoltaSrfLandedSalinas = Sales de amonio que deja el mar al evaporarse.
		CenizaSrfLanded = Arcillas con amonio, igual que las de Ceres. Ceniza se formó en el cinturón de asteroides y Skolta la capturó.
		CenizaSrfLandedMonteSolitario = Hielo de agua y sales de carbonato de amonio. El Monte Solitario es un criovolcán: salmuera que subió del interior y se congeló.
	}
}

@EXPERIMENT_DEFINITION[temperatureScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		SkoltaSrfLanded = −35 °C en el ecuador y unos −60 °C en los polos. Sin efecto invernadero, a esta distancia de Kerbol estaría a −100 °C: el amoníaco y el metano retienen el calor.
		SkoltaSrfSplashed = El mar está a unos −40 °C. El amoníaco es líquido entre −78 y −33 °C a la presión de Kerbin; con los 4 bar de Skolta no herviría hasta cerca de 0 °C.
		CenizaSrfLanded = −120 °C. Sin atmósfera, Ceniza no retiene nada del poco calor que llega.
	}
}

@EXPERIMENT_DEFINITION[barometerScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		SkoltaSrfLanded = 4 bar: 76 % de nitrógeno, 21 % de amoníaco y 3 % de metano. El aire pesa 5 kg por metro cúbico, cuatro veces más que en Kerbin.
		SkoltaFlyingHigh = Por encima de las nubes, la bruma orgánica se extiende hasta muy arriba. La fotólisis del metano la produce sin parar.
		SkoltaSrfSplashed = Sobre el mar el aire está casi saturado de amoníaco: lo que se evapora vuelve a caer como llovizna.
	}
}

@EXPERIMENT_DEFINITION[seismicScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		SkoltaSrfLanded = Una sola placa rígida, sin tectónica: el manto es seco. Los volcanes crecen sobre puntos calientes, como en Duna.
		SkoltaSrfLandedCamposVolcanicos = Temblores suaves bajo el campo volcánico: el magma aún sube a la superficie.
		CenizaSrfLanded = Ceniza está muerta por dentro, salvo un leve crujido bajo el Monte Solitario.
	}
}

@EXPERIMENT_DEFINITION[gravityScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		SkoltaSrfLanded = 0.75 g. Skolta tiene el tamaño de Kerbin, pero es menos denso: tiene poco hierro y un núcleo pequeño.
		SkoltaInSpaceLow = El campo gravitatorio delata un núcleo metálico pequeño. Por eso el campo magnético es débil.
	}
}
