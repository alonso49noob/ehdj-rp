// Con EVE las nubes ya las pone EVE: la vista lejana pasa a la textura sin nubes horneadas.
@Kopernicus:AFTER[MundosLejanos]:NEEDS[EnvironmentalVisualEnhancements]
{
	@Body[Halum]
	{
		@ScaledVersion
		{
			@Material
			{
				@texture = MundosLejanos/PluginData/Halum/Halum_ScaledEVE.png
			}
		}
	}
	@Body[Tenebris]
	{
		@ScaledVersion
		{
			@Material
			{
				@texture = MundosLejanos/PluginData/Tenebris/Tenebris_ScaledEVE.png
			}
		}
	}
	@Body[Salus]
	{
		@ScaledVersion
		{
			@Material
			{
				@texture = MundosLejanos/PluginData/Salus/Salus_ScaledEVE.png
			}
		}
	}
}
