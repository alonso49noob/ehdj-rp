// =============================================================================
//  TEXTOS DE CIENCIA del sistema Kraken
//  En español: observaciones normales.
//  En INGLÉS: registros de las máquinas (solo en sus biomas). Juntos cuentan su historia:
//    Krax / Fundicion de las Maquinas  -> dónde se replican
//    Scarch / Campos de Extraccion     -> qué extraen y por qué
//    Tenebris / Restos de la Maquina   -> qué opinan de los kerbals
// =============================================================================
@EXPERIMENT_DEFINITION[crewReport]:FOR[MundosLejanos]
{
	@RESULTS
	{
		KrakenInSpaceHigh = Kraken no parece una estrella: es un disco granate oscuro, con bandas como un planeta gigante, que apenas ilumina. Hay que dejar que los ojos se acostumbren.
		KrakenInSpaceLow = Tan cerca se ven las bandas de nubes ardientes moverse. Una aurora verdosa recorre los polos.
		KraxInSpaceLow = Krax es casi invisible: una silueta negra contra las estrellas. Solo la delatan los destellos metálicos de sus cráteres jóvenes.
		KraxSrfLanded = El suelo cruje como carbón. La enana ocupa medio cielo y el calor atraviesa el casco.
		KraxSrfLandedFundiciondelasMaquinas = [VISUAL LOG] Terraced pit, 1.5 km deep, 60 km across. Six perfectly level benches. Conveyor trenches run straight to the horizon. No one in the crew wants to say the word "factory" first.
		ScarchInSpaceHigh = Una bola gris rojiza envuelta en neblina. En el lado nocturno parpadean luces en cuadrícula que no son volcanes.
		ScarchFlyingLow = Turbulencia brutal, cielo marrón y gotas calientes en el cristal. La nave se mueve como si volara a través de sopa.
		ScarchSrfSplashed = El mar burbujea como un refresco y huele a vinagre. Las manchas de aceite forman remolinos irisados.
		ScarchSrfLanded = 50 °C y una humedad que empaña todo. A lo lejos, un volcán; más cerca, la nieve marrón que cayó el último ciclo.
		ScarchSrfLandedCamposdeExtraccion = [VISUAL LOG] Rectangular pits in a perfect grid, each 6 km wide. Metal spires stand at every intersection. Something here has been mining the planet for a long time, and it has noticed us.
		TenebrisInSpaceHigh = Un planeta casi negro bajo una luz rojiza. Los océanos solo se distinguen de la tierra por el brillo de las nubes.
		TenebrisSrfLanded = Arena negra de basalto hasta donde alcanza la vista, y un mar oscuro que rompe en silencio. Kraken cuelga inmóvil sobre el horizonte, igual que hace un siglo.
		TenebrisSrfLandedAsentamientoKerbal = Los colonos saludan desde las cúpulas presurizadas. Bombean agua del subsuelo, la parten en hidrógeno y oxígeno, y así tienen aire y combustible. Aquí la ciencia ya está hecha: lo interesante está ahí fuera.
		TenebrisSrfLandedRestosdelaMaquina = [VISUAL LOG] Impact crater, 13 km across. At its center, the shattered frame of a machine the size of a VAB. Scorch marks match colonial defense ordnance. Its sensor clusters are still facing the settlement.
		SalusSrfSplashed = El agua es tan salada que la nave flota alta, como un corcho. La espuma deja cristales blancos en el casco.
		SalusSrfLanded = Una isla estrecha y curva que se pierde en el horizonte: el borde de una cuenca de cientos de kilómetros, casi todo bajo el agua.
		SalusInSpaceLow = Las islas forman arcos perfectos, como si alguien hubiera dibujado círculos con un compás sobre el océano.
		VestigiaSrfLanded = Salus llena el cielo: un océano gris verdoso casi sin tierra. Desde aquí se ve el arco de islas que dejó el impacto que creó esta luna.
		NoxInSpaceLow = Nox es casi imposible de ver: una mancha más negra que el espacio que solo se delata cuando tapa las estrellas.
		NoxSrfLanded = El suelo absorbe la luz de los focos como si no estuviera. Salus, un disco gris verdoso, es lo único brillante del cielo.
		LumenInSpaceHigh = Lumen es un disco gris, con un casquete blanco en el polo sur. Aun así brilla el triple que el disco negro de Tenebris.
		LumenSrfLanded = El hielo está cubierto de un polvo gris y fino que se pega a las botas. Sobre el horizonte, la cara nocturna de Tenebris recibe el tenue reflejo de Lumen.
		FuligoInSpaceLow = Fuligo parece un agujero en el cielo. Solo un puñado de cráteres frescos, grises, revelan que hay algo ahí.
		FuligoSrfLanded = El hollín es tan negro que las sombras no se distinguen del suelo. Hay que aterrizar con el radar.
		CaligoSrfLanded = Cada paso levanta una nube de polvo de carbono que flota durante minutos antes de volver a caer.
		AtraSrfLanded = Atra es tan pequeña y tan negra que la nave estuvo a punto de pasar de largo sin verla.
		AzabacheSrfLanded = Bajo los focos, la roca negra destella en azul: es carbono vítreo, como el azabache.
		BreaSrfLanded = La superficie es pegajosa. Las patas de aterrizaje se despegan con un chasquido.
		HollinInSpaceLow = El radar dice que está ahí; los ojos, que no hay nada. Hollín es el objeto más oscuro conocido.
		IgneaInSpaceLow = Placas negras a la deriva sobre un mar naranja. Algunas grietas brillan tanto que dejan marca en la vista.
		IgneaSrfLanded = La costra tiembla bajo los pies. Entre placa y placa, a pocos metros, el magma burbujea.
	}
}

@EXPERIMENT_DEFINITION[evaReport]:FOR[MundosLejanos]
{
	@RESULTS
	{
		KraxSrfLanded = El polvo de grafito se pega a todo y deja el traje gris. Por la cara de día las botas humean.
		KraxSrfLandedFundiciondelasMaquinas = [EVA LOG] The bench edges are cut, not eroded: tool marks every 40 cm. A broken spire lies half buried. Its interior is layered carbon, grown rather than built.
		ScarchSrfLanded = El visor se empaña en segundos y el traje gotea. Cada paso hunde las botas en la nieve marrón: huele a alquitrán.
		ScarchSrfLandedCamposdeExtraccion = [EVA LOG] The spires hum at a frequency the suit can feel through the boots. Nearest unit rotated toward us at 600 m. It did not fire. Yet.
		TenebrisSrfLanded = Sin el casco, un kerbal no duraría ni un minuto: el aire tiene un 18 % de CO2. Con él, el paseo es casi agradable: 5 °C y brisa del mar.
		TenebrisSrfLandedRestosdelaMaquina = [EVA LOG] Recovered a plate with markings: a spiral of dots that matches no kerbal script. A sensor lens still flickers when it faces the light of Kraken.
		SalusSrfLanded = La sal cruje bajo las botas como nieve dura. Las olas dejan costras blancas a cada retirada.
		IgneaSrfLanded = El calor del suelo atraviesa las suelas. El control de misión recomienda no quedarse quieto en el mismo sitio.
	}
}

@EXPERIMENT_DEFINITION[surfaceSample]:FOR[MundosLejanos]
{
	@RESULTS
	{
		KraxSrfLanded = Grafito casi puro con vetas de carburo de silicio. Un planeta hecho de mina de lápiz.
		KraxSrfLandedFundiciondelasMaquinas = [SAMPLE LOG] Slag from the benches: graphite stripped of trace metals with 99.9% efficiency. Isotopic signature of the processing heat does not match Kraken, Krax, or any natural source.
		ScarchSrfLanded = Basalto empapado de compuestos orgánicos. La "nieve" son partículas de tolina del tamaño de granos de arena.
		ScarchSrfSplashed = Agua con un pH de 3.8 saturada de CO2, con una película de hidrocarburos. Exótica, pero agua al fin.
		ScarchSrfLandedCamposdeExtraccion = [SAMPLE LOG] Pit floor rock is depleted of iron, nickel and phosphorus to bedrock depth. Fragments of an exhaust filter contain methane, produced in volumes that alter the atmosphere of the planet.
		TenebrisSrfLanded = Basalto rico en hierro y magnetita: por eso Tenebris es tan oscuro. Ni rastro de vida, pero el agua del suelo es potable tras filtrarla.
		TenebrisSrfLandedRestosdelaMaquina = [SAMPLE LOG] Hull alloy grown in layers like a seashell. Embedded memory lattice partially readable. Recovered string, translated: "JUVENILE SYSTEM. HIGH YIELD. LOCAL ORGANICS CLASSIFIED: OBSTRUCTION."
		SalusSrfLanded = Halita y yeso sobre basalto alterado. El agua del océano tiene casi diez veces la salinidad de los mares de Kerbin.
		SalusSrfSplashed = Salmuera de 1.2 g/cm³ con hidrógeno disuelto. Ahí está el falso "mundo hiceano".
		VestigiaSrfLanded = Basalto vitrificado: roca de Salus fundida por el impacto y soldada de nuevo en órbita.
		NoxSrfLanded = Carbono orgánico casi puro: la misma composición que el Cinturón Oscuro. Nox no nació junto a Salus.
		LumenSrfLanded = Hielo de agua al 92 %, con un 8 % de polvo de carbono del disco de Kraken: por eso es gris. Es la fuente de agua de la colonia de Tenebris.
		FuligoSrfLanded = Hollín orgánico sobre hielo sucio: albedo de 0.01. El material más oscuro recogido nunca.
		CaligoSrfLanded = Polvo de carbono de granos submicrométricos: casi humo sólido.
		EscoriaSrfLanded = Escoria vítrea y porosa: el rastro de un choque a una velocidad enorme entre dos cuerpos del cinturón.
		IgneaSrfLanded = Costra de basalto todavía caliente, de pocos años de edad. Las rocas más jóvenes jamás recogidas.
	}
}

@EXPERIMENT_DEFINITION[temperatureScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		KraxSrfLanded = 311 °C en el punto subestelar. Con un albedo normal haría unos 70 °C menos.
		ScarchSrfLanded = 50 °C estables, con oscilaciones de varios grados que coinciden con el ciclo de la neblina.
		ScarchSrfLandedCamposdeExtraccion = [THERMAL LOG] Ground temperature at the pits: 210 °C. The heat is coming from below the machines, not from the planet.
		TenebrisSrfLanded = 5 °C. Fresco pero estable: el efecto invernadero compensa la poca luz.
		SalusSrfSplashed = −5 °C en el agua líquida. Cualquier otro océano estaría congelado: aquí lo impide la sal.
		IgneaSrfLanded = 380 °C a un metro de una grieta. El termómetro se rinde antes que la costra.
	}
}

@EXPERIMENT_DEFINITION[seismicScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		KraxSrfLandedFundiciondelasMaquinas = [SEISMIC LOG] Rhythmic pulses every 11.4 seconds from 4 km below the pit. Not tectonic. Something is still digging.
		ScarchSrfLanded = Temblores volcánicos casi continuos: el interior de Scarch aún no se ha enfriado tras su formación.
		SalusSrfLanded = Las islas se apoyan sobre roca fracturada por impactos: la señal sísmica rebota en capas rotas.
		IgneaSrfLanded = Toda la superficie vibra. No hay un suelo firme: hay placas flotando.
	}
}

@EXPERIMENT_DEFINITION[barometerScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		ScarchSrfLanded = 25.0 atm. Volver a órbita desde aquí va a necesitar algo más que un buen cohete.
		ScarchSrfLandedCamposdeExtraccion = [ATMOSPHERIC LOG] Methane spikes downwind of the spires. The organic snow cycle on this planet is not only volcanic.
		TenebrisSrfLanded = 1.3 atm: 80 % de nitrógeno, 18 % de CO2 y algo de argón. Sin oxígeno, los motores de reacción no sirven, pero los paracaídas sí.
		SalusSrfLanded = 2 atm, con trazas de hidrógeno que suben del océano.
	}
}

@EXPERIMENT_DEFINITION[gravityScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		KrakenInSpaceLow = Masa de 22 Jool comprimida en apenas un poco más que el tamaño de Jool: un objeto que estuvo a punto de ser una estrella.
		KraxInSpaceLow = Densidad muy alta para su tamaño: bajo el grafito hay un gran núcleo de hierro.
		SalusInSpaceLow = Cuatro anomalías circulares enormes: las cuencas de los impactos, rellenas de agua y sedimento.
	}
}

// ---- Rasgos únicos de las lunas y del Cinturón Oscuro
@EXPERIMENT_DEFINITION[crewReport]:FOR[MundosLejanos]
{
	@RESULTS
	{
		VestigiaSrfLandedCuencaMultianillo = En el fondo de la cuenca multianillo: un suelo de vidrio oscuro y, en el horizonte, el primero de tres anillos de montañas concéntricos.
		NoxSrfLandedGranCrater = Dentro del gran cráter de Nox. El impacto que lo hizo debió de estar a punto de partir la luna en dos.
		LumenSrfLandedFranjasdeTigre = Junto a una franja de tigre: una grieta azulada de la que sube una columna de vapor que se congela al instante y cae como nieve fresca.
		FuligoInSpaceLow = Fuligo es un agujero negro en el cielo, salvo por un punto brillante: el Ojo, un cráter lleno de sales blancas.
		FuligoSrfLandedOjodeFuligo = Dentro del Ojo: el suelo es una costra blanca de sales que brilla con la luz de los focos. El único sitio claro de un mundo negro.
		CaligoSrfLandedCatena = En uno de los doce cráteres alineados de la catena. Desde el borde se ve el siguiente, y el siguiente, en línea recta hasta el horizonte.
		AtraInSpaceLow = Atra gira despacio, como un puro lanzado al aire: tres veces más larga que ancha. Ningún otro cuerpo del sistema tiene esta forma.
		AtraSrfLandedExtremos = En el extremo de Atra el suelo es rojizo y la gravedad apunta de lado: la mayor parte de la masa está detrás, a decenas de kilómetros.
		AzabacheSrfLandedFacetasVitreas = Las facetas de Azabache son planas y lisas como el cristal. Los focos arrancan destellos azules de sus bordes.
		BreaSrfLandedCharcosdeBrea = Un charco de brea negra y lisa. Una bota se queda pegada un segundo antes de soltarse.
		TizneSrfLandedCamposdeBloques = Bloques del tamaño de edificios apilados sin orden, apenas sujetos por la gravedad. Mejor no tocar nada.
		EscoriaSrfLandedVesiculas = El suelo está lleno de agujeros: burbujas de gas que se quedaron atrapadas cuando esta roca era líquida.
		HollinSrfLandedBaliza = [VISUAL LOG] A level pad, cut flat. A single spire on top, transmitting on a narrow band toward Scarch. The machines were here before anyone else.
	}
}
@EXPERIMENT_DEFINITION[evaReport]:FOR[MundosLejanos]
{
	@RESULTS
	{
		HollinSrfLandedBaliza = [EVA LOG] The spire hums. Its carrier signal repeats every 11.4 seconds, the same rhythm recorded under the Foundry on Krax. This is a relay node.
		LumenSrfLandedFranjasdeTigre = La nieve que cae del géiser se posa en el casco. Es la única nieve limpia de Lumen: el kerbal vuelve más blanco que la luna que pisa.
	}
}
@EXPERIMENT_DEFINITION[surfaceSample]:FOR[MundosLejanos]
{
	@RESULTS
	{
		HollinSrfLandedBaliza = [SAMPLE LOG] Pad surface fused at over 2 000 K. Embedded fragment of the same layered alloy found on Tenebris. Isotopic age of the weld: older than the colony.
		FuligoSrfLandedOjodeFuligo = Carbonatos y cloruros: sales que subieron desde una capa de salmuera bajo el hollín. Fuligo tuvo agua líquida dentro.
		AtraSrfLandedExtremos = La composición isotópica no coincide con nada del sistema Kraken ni de Kerbol. Atra viene de otra estrella.
	}
}
@EXPERIMENT_DEFINITION[seismicScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		HollinSrfLandedBaliza = [SEISMIC LOG] Pulses every 11.4 seconds from under the pad. Same frequency as the digging beneath the Foundry on Krax.
	}
}
