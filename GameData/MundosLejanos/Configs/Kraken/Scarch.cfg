//  Lo enfría una neblina orgánica cíclica: el metano se rompe en lo alto (auroras y
//  destellos de Kraken), la neblina refleja la luz y enfría el planeta, las partículas
//  crecen y caen como "nieve" orgánica; el cielo se despeja, se calienta y vuelta a empezar.
