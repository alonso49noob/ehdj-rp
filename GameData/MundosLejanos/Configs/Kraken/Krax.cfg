// =============================================================================
//  KRAX — mundo de carbono tipo Mercurio, en la zona caliente de Kraken
//  Albedo 0.03 (costra de grafito): absorbe el 97 % de la luz y está más caliente de lo
//  que le corresponde: 413 K de media (381 K tendría con un albedo normal), 584 K (311 °C)
//  en el punto subestelar. En rotación síncrona: un hemisferio de día perpetuo.
//  La Fundición de las Máquinas (20° N, 60° O) es una mina a cielo abierto en terrazas.
// =============================================================================
@Kopernicus:FOR[MundosLejanos]
{
	Body
	{
		name = Krax
		Template
		{
			name = Moho
			removeAllPQSMods = true
		}
		Properties
		{
			displayName = Krax^N
			description = El planeta más cercano a Kraken y el más negro del sistema. Su costra de grafito y hollín, hija de la química orgánica del disco, absorbe el 97 % de la luz, así que Krax está más caliente de lo que le correspondería incluso tan cerca de la enana. En la cara de día se superan los 300 °C. Las escarpas de cientos de metros son cicatrices de su núcleo al contraerse. En el hemisferio norte se abre la Fundición: una mina en terrazas de origen inexplicable.
			radius = 260000
			geeASL = 0.45
			rotates = true
			tidallyLocked = true
			initialRotation = 0
			isHomeWorld = false
			timewarpAltitudeLimits = 0 10000 10000 25000 50000 100000 200000 300000
			ScienceValues
			{
				landedDataValue = 18
				splashedDataValue = 1
				flyingLowDataValue = 1
				flyingHighDataValue = 1
				inSpaceLowDataValue = 14
				inSpaceHighDataValue = 12
				recoveryValue = 16
				flyingAltitudeThreshold = 10000
				spaceAltitudeThreshold = 80000
			}
			biomeMap = MundosLejanos/PluginData/Krax/Krax_Biomes.png
			Biomes
			{
				Biome
				{
					name = Llanuras de Grafito
					displayName = Llanuras de Grafito
					value = 1.0
					color = #4a4a8a
				}
				Biome
				{
					name = Escarpes Lobulados
					displayName = Escarpes Lobulados
					value = 1.2
					color = #8a6ad0
				}
				Biome
				{
					name = Cuencas de Impacto
					displayName = Cuencas de Impacto
					value = 1.1
					color = #2a5a8a
				}
				Biome
				{
					name = Crateres Jovenes
					displayName = Cráteres Jóvenes
					value = 1.4
					color = #e0e0e0
				}
				Biome
				{
					name = Fundicion de las Maquinas
					displayName = Fundición de las Máquinas
					value = 2.0
					color = #d02020
				}
			}
		}
		Orbit
		{
			referenceBody = Kraken
			semiMajorAxis = 28400000
			eccentricity = 0.01
			inclination = 0.5
			longitudeOfAscendingNode = 0
			argumentOfPeriapsis = 0
			meanAnomalyAtEpoch = 0.3
			epoch = 0
			color = 0.25,0.25,0.28,1
		}
		ScaledVersion
		{
			type = Vacuum
			Material
			{
				texture = MundosLejanos/PluginData/Krax/Krax_Color.png
				normals = MundosLejanos/PluginData/Krax/Krax_Normal.png
				specColor = 0.1,0.1,0.1,1	// el grafito tiene un brillo metálico
				shininess = 0.35	// reflejo concentrado: con 0.05-0.2 cubría medio planeta (plástico)
			}
		}
		PQS
		{
			materialType = AtmosphericExtra
			allowFootprints = True
			Material
			{
				saturation = 1
				contrast = 1.2
				tintColor = 1,1,1,0
				groundTexStart = 0
				groundTexEnd = 9000
				steepTexStart = 0
				steepTexEnd = 9000
				steepTex = CTTP/Textures/PluginData/cliff.dds
				steepBumpMap = CTTP/Textures/PluginData/cliff_normal.dds
				steepNearTiling = 2500
				steepTiling = 25
				lowTex = CTTP/Textures/PluginData/gravel.dds
				lowBumpMap = CTTP/Textures/PluginData/gravel_normal.dds
				lowNearTiling = 5000
				lowMultiFactor = 50
				lowBumpNearTiling = 5000
				lowBumpFarTiling = 50
				midTex = CTTP/Textures/PluginData/cracked.dds
				midBumpMap = CTTP/Textures/PluginData/cracked_normal.dds
				midNearTiling = 7500
				midMultiFactor = 75
				midBumpNearTiling = 7500
				midBumpFarTiling = 75
				highTex = CTTP/Textures/PluginData/rock.dds
				highBumpMap = CTTP/Textures/PluginData/rock_normal.dds
				highNearTiling = 5000
				highMultiFactor = 50
				highBumpNearTiling = 5000
				highBumpFarTiling = 50
				lowStart = 0
				lowEnd = 0.3
				highStart = 0.6
				highEnd = 1
			}
			Mods
			{
				// h = offset + gris * deformity  ->  -1 800 m (fondo de la Fundición) … +1 800 m
				VertexHeightMap
				{
					map = MundosLejanos/PluginData/Krax/Krax_Height.png
					offset = -1800
					deformity = 3600
					scaleDeformityByRadius = false
					order = 10
					enabled = true
				}
				VertexSimplexHeightAbsolute
				{
					seed = 6101
					deformity = 60
					octaves = 6
					persistence = 0.5
					frequency = 40
					order = 20
					enabled = true
				}
				VertexColorMap
				{
					map = MundosLejanos/PluginData/Krax/Krax_Color.png
					order = 50
					enabled = true
				}
			}
		}
	}
}
