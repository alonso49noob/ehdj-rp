// =============================================================================
//  TENEBRIS — mundo oscuro con agua líquida a 5 °C: INHABITABLE, pero fácil de colonizar
//  Albedo bajo mineral: basalto rico en hierro, arena volcánica y océanos que absorben casi
//  toda la luz tenue y rojiza de Kraken. Aire 80 % N2 + 18 % CO2 + 2 % Ar: sin oxígeno,
//  irrespirable. Lo que lo hace colonizable: agua líquida (combustible y vida en cúpulas),
//  1.3 atm (paracaídas útiles), 5 °C estables, 0.85 g y mareas tranquilas.
//  Asentamiento Kerbal: meseta plana a 12° N, 35° E (lista para Kerbal Konstructs).
//  Restos de la Máquina: cráter a 18° S, 140° E.
// =============================================================================
