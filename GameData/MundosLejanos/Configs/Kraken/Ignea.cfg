// =============================================================================
//  IGNEA — protoplaneta con océano de magma dentro del disco protoplanetario
//  La "formación activa" que se puede visitar: un embrión planetario recién golpeado,
//  con placas de costra flotando sobre magma y grietas incandescentes.
//  KSP no permite superficies emisivas: el brillo está pintado en la textura.
// =============================================================================
@Kopernicus:FOR[MundosLejanos]
{
	Body
	{
		name = Ignea
		Template
		{
			name = Dres
			removeAllPQSMods = true
		}
		Properties
		{
			displayName = Ignea^N
			description = Un planeta a medio hacer. Ignea orbita dentro del disco protoplanetario de Kraken y cada pocos miles de años lo funde otro impacto. Su superficie es un mar de magma con placas de costra negra a la deriva, separadas por grietas que brillan en naranja. Es lo que fueron todos los planetas del sistema antes de enfriarse.
			radius = 180000
			geeASL = 0.15
			rotates = true
			rotationPeriod = 20000
			tidallyLocked = false
			initialRotation = 0
			isHomeWorld = false
			timewarpAltitudeLimits = 0 6000 12000 24000 48000 96000 192000 384000
			ScienceValues
			{
				landedDataValue = 20
				splashedDataValue = 1
				flyingLowDataValue = 1
				flyingHighDataValue = 1
				inSpaceLowDataValue = 15
				inSpaceHighDataValue = 12
				recoveryValue = 18
				flyingAltitudeThreshold = 5000
				spaceAltitudeThreshold = 60000
			}
			biomeMap = MundosLejanos/PluginData/Ignea/Ignea_Biomes.png
			Biomes
			{
				Biome
				{
					name = Mar de Magma
					displayName = Mar de Magma
					value = 1.5
					color = #ff6020
				}
				Biome
				{
					name = Costra Enfriada
					displayName = Costra Enfriada
					value = 1.0
					color = #603020
				}
				Biome
				{
					name = Grietas Incandescentes
					displayName = Grietas Incandescentes
					value = 1.8
					color = #ffd040
				}
			}
		}
		Orbit
		{
			referenceBody = Kraken
			semiMajorAxis = 250000000	// dentro del disco protoplanetario (150 000–400 000 km), en su hueco
			eccentricity = 0.06
			inclination = 3
			longitudeOfAscendingNode = 200
			argumentOfPeriapsis = 0
			meanAnomalyAtEpoch = 5.0
			epoch = 0
			color = 0.95,0.45,0.15,1
		}
		ScaledVersion
		{
			type = Vacuum
			Material
			{
				texture = MundosLejanos/PluginData/Ignea/Ignea_Color.png
				normals = MundosLejanos/PluginData/Ignea/Ignea_Normal.png
				specColor = 0.06,0.06,0.06,1	// costra mate; el magma apenas brilla
				shininess = 0.4	// reflejo concentrado: con 0.05-0.2 cubría medio planeta (plástico)
			}
		}
		PQS
		{
			materialType = AtmosphericExtra
			allowFootprints = True
			Material
			{
				saturation = 1
				contrast = 1.2
				tintColor = 1,1,1,0
				groundTexStart = 0
				groundTexEnd = 9000
				steepTexStart = 0
				steepTexEnd = 9000
				steepTex = CTTP/Textures/PluginData/cliff.dds
				steepBumpMap = CTTP/Textures/PluginData/cliff_normal.dds
				steepNearTiling = 2500
				steepTiling = 25
				lowTex = CTTP/Textures/PluginData/cracked.dds
				lowBumpMap = CTTP/Textures/PluginData/cracked_normal.dds
				lowNearTiling = 7500
				lowMultiFactor = 75
				lowBumpNearTiling = 7500
				lowBumpFarTiling = 75
				midTex = CTTP/Textures/PluginData/rock.dds
				midBumpMap = CTTP/Textures/PluginData/rock_normal.dds
				midNearTiling = 5000
				midMultiFactor = 50
				midBumpNearTiling = 5000
				midBumpFarTiling = 50
				highTex = CTTP/Textures/PluginData/rock.dds
				highBumpMap = CTTP/Textures/PluginData/rock_normal.dds
				highNearTiling = 5000
				highMultiFactor = 50
				highBumpNearTiling = 5000
				highBumpFarTiling = 50
				lowStart = 0
				lowEnd = 0.35
				highStart = 0.6
				highEnd = 1
			}
			Mods
			{
				VertexHeightMap
				{
					map = MundosLejanos/PluginData/Ignea/Ignea_Height.png
					offset = -500
					deformity = 1200
					scaleDeformityByRadius = false
					order = 10
					enabled = true
				}
				VertexColorMap
				{
					map = MundosLejanos/PluginData/Ignea/Ignea_Color.png
					order = 50
					enabled = true
				}
			}
		}
	}
}
