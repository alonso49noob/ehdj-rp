// =============================================================================
//  TEXTOS DE CIENCIA del sistema Creus–Halum
//  Claves: <Cuerpo><Situación>[<Bioma sin espacios>]; varias claves iguales = elección aleatoria.
// =============================================================================
@EXPERIMENT_DEFINITION[crewReport]:FOR[MundosLejanos]
{
	@RESULTS
	{
		CreusInSpaceHigh = Creus llena la ventana: un disco blanco perfecto atravesado por la línea negra del anillo. Kerbol, detrás, es solo una estrella más.
		CreusInSpaceLow = Las nubes de metano forman parches gris perla que se desplazan como témpanos. Bajo ellas no se ve nada.
		CreusFlyingHigh = El cielo tiene un blanco lechoso. El anillo atraviesa el horizonte como una cicatriz oscura.
		CreusFlyingLow = La presión no deja de subir y el casco cruje. En algún lugar ahí abajo hay un océano que no es ni líquido ni gas.
		HalumInSpaceHigh = Halum brilla con un halo azul. Las vetas blancas de nubes giran en bandas, como pinceladas.
		HalumInSpaceLow = A través de los huecos entre nubes se ven islas pálidas sobre un mar azul oscuro. Algunas parecen haberse movido desde la última órbita.
		HalumFlyingLow = Llueven gotas de hidrógeno líquido que golpean el parabrisas y se evaporan al instante.
		HalumSrfSplashed = El vehículo flota en neón líquido a 32 K. El mar no tiene olor, color ni oleaje: parece cristal.
		HalumSrfLanded = Bajo los pies hay hielo de agua duro como el granito. Toda la isla flota, y se nota un balanceo lentísimo.
		HalumSrfLandedNievesdeHidrogeno = Caen copos de hidrógeno que no llegan a cuajar: se subliman al tocar cualquier cosa más caliente que el aire.
		OcreaInSpaceHigh = Ocrea brilla plateada con manchas violeta y lagos cian. Es lo más brillante del cielo después de Creus, y lo más frío que ha visto un kerbal.
		OcreaInSpaceLow = Entre las manchas de lecho violeta se ven puntos negros rodeados de halos: fumarolas. El resto de la luna está quieto.
		OcreaSrfLanded = Las patas del tren de aterrizaje se hunden en algo que parece nieve en polvo pero es hidrógeno sólido. El cielo es negro y Creus no se mueve en él.
		OcreaSrfLandedGlaciaresdeNeon = El suelo es neón sólido, liso como un espejo y surcado por líneas de flujo. Este glaciar avanza unos centímetros por siglo.
		OcreaSrfLandedCamposdeFumarolas = Del pozo sale una bruma tenue: hidrógeno que se sublima y vuelve a congelarse en el aire en cristales que brillan con la luz de los focos.
		PastoraSrfLanded = Desde aquí el anillo es una autopista gris que se pierde en ambas direcciones. Pastora apenas tiene gravedad para mantenernos en el suelo.
		PrimaSrfLanded = Halum se ve como una perla azul siempre en el mismo punto del cielo. Este troyano nunca se aleja de él.
		SecundaSrfLanded = Es hielo puro y casi transparente. Con la linterna se ven burbujas atrapadas a metros de profundidad.
		HeraldoSrfLanded = Hay chorros de gas por todas partes. Cada rayo de sol que llega arranca un poco más de este visitante.
		HeraldoInSpaceLow = Una costra negra con manchas de hielo brillante. Es difícil creer que algo tan oscuro haya viajado tanto.
	}
}

@EXPERIMENT_DEFINITION[evaReport]:FOR[MundosLejanos]
{
	@RESULTS
	{
		CreusInSpaceLow = Flotando sobre Creus se ve el anillo de canto: tan fino que desaparece y vuelve a aparecer con cada giro del casco.
		HalumSrfSplashed = Una mano enguantada roza el neón. El guante se pone rígido al instante y el control de misión sugiere no repetirlo.
		HalumSrfLanded = Las botas resbalan en el hielo. El borde de la isla termina en un acantilado que se hunde en el mar de neón.
		OcreaSrfLanded = Cada paso hunde al kerbal hasta la rodilla en escarcha de hidrógeno. El calor del traje la sublima y deja huellas que humean.
		PastoraSrfLanded = Un salto mal calculado y se alcanza la velocidad de escape. Mejor quedarse agarrado a la nave.
		HeraldoSrfLanded = Un chorro de gas lanza al kerbal varios metros sin avisar. El cometa no quiere visitas.
	}
}

@EXPERIMENT_DEFINITION[temperatureScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		CreusFlyingHigh = Se miden unos 35 K en la tropopausa, cerca del mínimo. El calor viene de dentro: Creus emite más energía de la que recibe de Kerbol.
		CreusFlyingLow = La temperatura sube rápido con la profundidad: más de 100 K a 10 atm. Más abajo, el agua debe superar los 647 K y su punto crítico.
		HalumSrfSplashed = 32 K. Justo en la ventana estrecha en que el neón es líquido y el hidrógeno sigue siendo gas.
		HalumSrfLanded = El hielo de agua está a 32 K. Aquí es tan inerte como una roca.
		HalumFlyingLow = La temperatura baja hasta 19 K en las nubes. Ahí el hidrógeno se condensa en gotas.
		OcreaSrfLanded = 5.6 K sobre la escarcha: el registro más frío del sistema. El lecho violeta desnudo marca 9 K porque absorbe más luz.
		OcreaSrfLandedCamposdeFumarolas = Junto a la fumarola el termómetro marca 14 K. Es poco, pero basta para que el hidrógeno no pueda seguir sólido.
	}
}

@EXPERIMENT_DEFINITION[barometerScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		CreusFlyingLow = 10 atm y subiendo. Los ingenieros piden subir antes de que el barómetro deje de existir.
		HalumSrfSplashed = 7.0 atm justas. Bajo la superficie, la presión del neón alcanza su punto crítico, 27 atm, a solo unos 310 m.
		HalumFlyingHigh = La presión baja con suavidad: en una atmósfera de hidrógeno, la altura de escala es enorme.
	}
}

@EXPERIMENT_DEFINITION[surfaceSample]:FOR[MundosLejanos]
{
	@RESULTS
	{
		HalumSrfLanded = La muestra es hielo de agua, con una densidad de 0.93 g/cm3, menor que la del neón líquido (1.21). Toda la isla es un iceberg.
		HalumSrfLandedIslasalaDeriva = El hielo tiene capas de polvo cometario, como los anillos de un árbol. Cada capa es un impacto: esta isla tiene miles.
		HalumSrfSplashed = El frasco se llena de neón líquido con hidrógeno disuelto. Hay que mantenerlo frío o reventará.
		OcreaSrfLanded = El frasco se llena de hidrógeno sólido que empieza a evaporarse en cuanto se cierra. Hay que mantenerlo por debajo de 13 K hasta casa.
		OcreaSrfLandedGlaciaresdeNeon = Un bloque de neón sólido, transparente y blando. Pesa 17 veces más que el mismo volumen de escarcha de hidrógeno.
		OcreaSrfLandedLechoDesnudo = Hielo de agua violeta: la radiación de miles de millones de años ha atrapado en él radicales que lo tiñen.
		PastoraSrfLanded = Polvo negro de carbono y metano irradiado, idéntico al material del anillo de Creus.
		PrimaSrfLanded = Polvo rojizo de tolinas: compuestos orgánicos que la radiación ha cocinado durante eones.
		SecundaSrfLanded = Hielo de agua casi puro, con trazas de neón atrapado en la red cristalina.
		HeraldoSrfLanded = Hielos volátiles bajo una costra de carbono. Es la muestra más antigua jamás recogida.
	}
}

@EXPERIMENT_DEFINITION[seismicScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		HalumSrfLanded = El sismómetro registra un balanceo de periodo larguísimo: la isla oscila sobre el océano.
		OcreaSrfLanded = Sacudidas suaves cada 5 días, al paso por el periapsis: las mareas de Creus todavía aprietan a Ocrea y calientan sus fumarolas.
	}
}

@EXPERIMENT_DEFINITION[gravityScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		HalumInSpaceLow = El campo gravitatorio es casi perfectamente esférico: un planeta fluido de arriba abajo.
		CreusInSpaceLow = El gravímetro detecta un núcleo denso bajo un manto inmenso. Ahí debe estar el océano supercrítico, y más abajo, la lluvia de diamantes.
		HalumInSpaceHigh = El campo gravitatorio indica una densidad bajísima, propia de un mundo casi solo de hidrógeno. No se parece a ningún planeta formado junto a Kerbol.
		OcreaInSpaceLow = Las cuencas pesan más de lo esperado: debajo de los glaciares hay cientos de metros de neón sólido, mucho más denso que el hielo de agua que lo rodea.
	}
}

@EXPERIMENT_DEFINITION[atmosphereAnalysis]:FOR[MundosLejanos]
{
	@RESULTS
	{
		CreusFlyingLow = Hidrógeno 94 %, metano 5 %, vapor de agua 1 %. El metano tiñe la luz de azul, pero las nubes blancas lo ocultan.
		HalumFlyingLow = Hidrógeno 92 % y neón 8 %, procedente del océano. La masa molar media es de 3.5 g/mol.
	}
}

// ---- Rasgos únicos de los cuerpos menores
@EXPERIMENT_DEFINITION[crewReport]:FOR[MundosLejanos]
{
	@RESULTS
	{
		PastoraSrfLandedCrestaEcuatorial = Sobre la cresta ecuatorial de Pastora: a ambos lados el suelo cae como el lomo de una nuez. Todo esto es polvo del anillo que se fue acumulando grano a grano.
		PrimaSrfLandedCuelloBrillante = En el cuello que une los dos lóbulos de Prima. A cada lado se levanta una roca entera, rojiza; aquí el suelo es más claro, como si el contacto lo hubiera pulido.
		SecundaSrfLandedAcantiladoVerona = Al borde del acantilado de Verona. La pared de hielo cae 3.6 km. Con esta gravedad, un salto tardaría casi cinco minutos en llegar abajo. Alguien ya lo está pensando.
		HeraldoSrfLandedPozosActivos = Al borde de un pozo de paredes verticales. Al fondo brilla hielo limpio, y de vez en cuando sale un chorro de gas que arrastra polvo hacia el espacio.
	}
}
@EXPERIMENT_DEFINITION[evaReport]:FOR[MundosLejanos]
{
	@RESULTS
	{
		SecundaSrfLandedAcantiladoVerona = El kerbal se asoma al acantilado de Verona y pregunta si alguien ha cronometrado la caída. Nadie responde. Saltar sería lento, larguísimo y, probablemente, muy mala idea.
		PrimaSrfLandedCuelloBrillante = Desde el cuello, los dos lóbulos de Prima se elevan como dos colinas enormes que casi se tocan por encima de la cabeza.
	}
}
