// =============================================================================
//  OCREA — luna de escarcha de hidrógeno, el lugar más frío del sistema de Kerbol
//  Capturada, en órbita retrógrada alrededor de Creus. Sin atmósfera apreciable.
//  Sus capas se ordenan por densidad:
//    - hidrógeno sólido (0.086 g/cm3): mantos lisos y plateados
//    - neón sólido (1.44 g/cm3): glaciares cian en las cuencas
//    - hielo de agua (0.93 g/cm3): lecho violeta oscurecido por la radiación
//  La escarcha (albedo ~0.9) está a ~5.5 K; el lecho desnudo, a ~9 K, pierde su H2,
//  que se condensa sobre la escarcha: lo brillante sigue brillante y lo oscuro, oscuro.
// =============================================================================
@Kopernicus:FOR[MundosLejanos]
{
	Body
	{
		name = Ocrea
		Template
		{
			name = Vall
			removeAllPQSMods = true
		}
		Properties
		{
			displayName = Ocrea^N
			description = El lugar más frío del sistema de Kerbol. A unos 6 K el hidrógeno se congela y cubre Ocrea con mantos de escarcha plateada tan ligera (0.086 g/cm³) que una bota se hunde en ella como en polvo. En las cuencas, el neón sólido avanza muy despacio en glaciares de color cian. Debajo asoma un lecho de hielo de agua que la radiación ha teñido de violeta. Ocrea gira al revés que el resto de lunas: Creus la capturó. Restos del calor de aquella captura escapan por algunas fumarolas, donde el hidrógeno se sublima y deja halos oscuros.
			radius = 380000
			geeASL = 0.18
			rotates = true
			tidallyLocked = true
			initialRotation = 0
			isHomeWorld = false
			timewarpAltitudeLimits = 0 7200 14300 28500 57000 114000 228000 456000
			ScienceValues
			{
				landedDataValue = 16
				splashedDataValue = 1
				flyingLowDataValue = 1
				flyingHighDataValue = 1
				inSpaceLowDataValue = 12
				inSpaceHighDataValue = 10
				recoveryValue = 13
				flyingAltitudeThreshold = 10000
				spaceAltitudeThreshold = 140000
			}
			biomeMap = MundosLejanos/PluginData/Ocrea/Ocrea_Biomes.png
			Biomes
			{
				Biome
				{
					name = Lecho Desnudo
					displayName = Lecho Desnudo
					value = 1.0
					color = #6a4c9c
				}
				Biome
				{
					name = Mantos de Hidrogeno
					displayName = Mantos de Hidrógeno
					value = 1.2
					color = #b8a8f0
				}
				Biome
				{
					name = Glaciares de Neon
					displayName = Glaciares de Neón
					value = 1.3
					color = #5fd0e0
				}
				Biome
				{
					name = Campos de Fumarolas
					displayName = Campos de Fumarolas
					value = 1.7
					color = #e04070
				}
				Biome
				{
					name = Polos de Escarcha
					displayName = Polos de Escarcha
					value = 1.2
					color = #f8f8f8
				}
			}
		}
		Orbit
		{
			referenceBody = Creus
			semiMajorAxis = 22000000
			eccentricity = 0.05	// resto de la captura
			inclination = 152	// retrógrada
			longitudeOfAscendingNode = 20
			argumentOfPeriapsis = 40
			meanAnomalyAtEpoch = 0
			epoch = 0
			color = 0.75,0.70,0.92,1
		}
		ScaledVersion
		{
			type = Vacuum
			fadeStart = 95000
			fadeEnd = 190000
			Material
			{
				texture = MundosLejanos/PluginData/Ocrea/Ocrea_Color.png
				normals = MundosLejanos/PluginData/Ocrea/Ocrea_Normal.png
				shininess = 0.2
			}
		}
		PQS
		{
			fadeStart = 190000
			fadeEnd = 380000
			deactivateAltitude = 381900
			materialType = AtmosphericExtra
			allowFootprints = True
			Material
			{
				saturation = 1
				contrast = 1.1
				tintColor = 1,1,1,0
				groundTexStart = 0
				groundTexEnd = 9000
				steepTexStart = 0
				steepTexEnd = 9000
				steepTex = CTTP/Textures/PluginData/cliff.dds
				steepBumpMap = CTTP/Textures/PluginData/cliff_normal.dds
				steepNearTiling = 2500
				steepTiling = 25
				lowTex = CTTP/Textures/PluginData/ice.dds
				lowBumpMap = CTTP/Textures/PluginData/ice_normal.dds
				lowNearTiling = 5000
				lowMultiFactor = 50
				lowBumpNearTiling = 5000
				lowBumpFarTiling = 50
				midTex = CTTP/Textures/PluginData/snow.dds
				midBumpMap = CTTP/Textures/PluginData/snow_normal.dds
				midNearTiling = 5000
				midMultiFactor = 50
				midBumpNearTiling = 5000
				midBumpFarTiling = 50
				highTex = CTTP/Textures/PluginData/cracked.dds
				highBumpMap = CTTP/Textures/PluginData/cracked_normal.dds
				highNearTiling = 7500
				highMultiFactor = 75
				highBumpNearTiling = 7500
				highBumpFarTiling = 75
				lowStart = 0
				lowEnd = 0.25
				highStart = 0.6
				highEnd = 1
			}
			Mods
			{
				// h = offset + gris * deformity  ->  -1 000 m (glaciares de neón) … +2 600 m (crestas del lecho)
				VertexHeightMap
				{
					map = MundosLejanos/PluginData/Ocrea/Ocrea_Height.png
					offset = -1000
					deformity = 3600
					scaleDeformityByRadius = false
					order = 10
					enabled = true
				}
				VertexSimplexHeightAbsolute
				{
					seed = 7302
					deformity = 80
					octaves = 7
					persistence = 0.5
					frequency = 36
					order = 20
					enabled = true
				}
				VertexColorMap
				{
					map = MundosLejanos/PluginData/Ocrea/Ocrea_Color.png
					order = 50
					enabled = true
				}
			}
		}
	}
}
