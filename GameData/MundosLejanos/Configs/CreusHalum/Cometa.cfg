// =============================================================================
//  COMA Y COLAS DEL COMETA HERALDO (plugin MundosLejanos.dll, código en plugin/Cometas.cs)
//  Kopernicus ya no permite partículas por .cfg: el plugin dibuja en el espacio escalado una coma
//  verdosa, una cola de iones azul (siempre opuesta a Kerbol) y una de polvo (curvada hacia atrás).
//  Heraldo: perihelio 4.2 KAU, afelio 800 KAU. Se activa al bajar de activityStart y alcanza el
//  máximo en activityFull (en KAU). Distancias en metros; colores RGB.
// =============================================================================
MUNDOSLEJANOS_COMETA
{
	body = Heraldo
	activityStart = 40
	activityFull = 4.2
	comaRadius = 40000000		// 40 000 km en el máximo
	ionTailLength = 1500000000	// 1.5 Gm
	dustTailLength = 800000000	// 0.8 Gm
	comaColor = 0.70,0.95,0.80
	ionTailColor = 0.35,0.60,1.00
	dustTailColor = 1.00,0.88,0.70
}
