// =============================================================================
//  AKIRA — mundo transneidoniano a 200 KAU de Kerbol (ficha del equipo)
//  Ficha: hielos de metano y nitrógeno, 900 km de diámetro (ya a escala de KSP: la ficha lo compara con
//  Plock), excepcionalmente activo, con una atmósfera sorprendentemente densa y estable.
//  R = 450 km, 0.2 g. Atmósfera de 1.2 atm: 92 % N2, 5 % CH4, 3 % CO, a 62 K (−211 °C).
//  La mantienen los criovolcanes: a 62 K el hielo de N2 solo sostendría ~0.09 bar.
//  Glaciar de Celdas (25° N, 160° E): N2 que convecciona en una cuenca, como Sputnik Planitia.
// =============================================================================
