// =============================================================================
//  KRAKEN — enana marrón T2 (~1 250 K, ~400 millones de años) a 0.2 años luz kerbales (~12 650 KAU)
//  22 masas de Jool (mu = 6.216e15), 1.05 radios de Jool. Disco de escombros en plena
//  era de bombardeo tardío: la "formación activa" del sistema.
//  Luz: el metano y los metales alcalinos se comen el centro del espectro visible,
//  así que su luz es tenue y rojiza, como la de unas brasas. L = 4πR²σT⁴ = 6.9e19 W.
//  Kopernicus mide `luminosity` como W/m² a 1 KAU (Kerbol = 1360) -> 0.0297.
// =============================================================================
@Kopernicus:FOR[MundosLejanos]
{
	Body
	{
		name = Kraken
		Template
		{
			name = Sun
			removeCoronas = true
		}
		Properties
		{
			displayName = Kraken^N
			description = Kraken es una enana marrón: demasiado pequeña para encender el hidrógeno, demasiado caliente para ser un planeta. Por fuera parece un gigante gaseoso que ardiera por dentro: bandas de nubes de sulfuros y sales, granates y pardo rojizo, con huecos por los que asoma el interior a 1 250 K. El metano y el sodio de su atmósfera absorben casi toda la luz amarilla y verde, así que lo poco que llega a sus planetas es un resplandor rojo y apagado, como el de unas brasas. Tiene unos 400 millones de años y sus planetas aún se forman a golpes. La rodean tres discos: uno interior de polvo caliente, el gran disco protoplanetario donde orbita Ignea y, más allá, el Cinturón Oscuro, un anillo de planetas enanos y asteroides tan negros que apenas se ven. Está a 0.2 años luz kerbales de Kerbol: unas 12 650 veces la distancia entre Kerbin y Kerbol.
			radius = 6300000
			geeASL = 15.97
			rotationPeriod = 18000
			tidallyLocked = false
			initialRotation = 0
			isHomeWorld = false
			timewarpAltitudeLimits = 0 100000 200000 400000 800000 1600000 3200000 6400000
			ScienceValues
			{
				inSpaceLowDataValue = 15
				inSpaceHighDataValue = 10
				recoveryValue = 20
				spaceAltitudeThreshold = 20000000
			}
		}
		Orbit
		{
			referenceBody = Sun
			semiMajorAxis = 172013708963479	// 0.2 años luz kerbales (1 kly = 63 241 KAU)
			eccentricity = 0
			inclination = 14
			longitudeOfAscendingNode = 300
			argumentOfPeriapsis = 0
			meanAnomalyAtEpoch = 1.0
			epoch = 0
			color = 0.65,0.28,0.24,1
		}
		ScaledVersion
		{
			type = Star
			Material
			{
				// Aspecto de enana T: gigante gaseoso incandescente, sin corona. Textura del artista: arte/Kraken_Textura.png
				// sunspotTex = su brillo (generar_texturas.kraken): zonas claras -> emitColor, bandas oscuras -> sunspotColor
				// emitColor0/1 = sus tonos medio-claro y claro; sunspotColor = su granate casi negro
				// noiseMap   = turbulencia fina estirada en latitud
				noiseMap = MundosLejanos/PluginData/Kraken/Kraken_Noise.dds
				sunspotTex = MundosLejanos/PluginData/Kraken/Kraken_Bands.dds
				emitColor0 = 0.80,0.25,0.34,1
				emitColor1 = 0.87,0.27,0.37,1
				sunspotPower = 1.0
				sunspotColor = 0.15,0.05,0.08,1
				rimColor = 0.45,0.12,0.18,1
				rimPower = 1.5
				rimBlend = 1.5
			}
			Light
			{
				givesOffLight = true
				luminosity = 0.0297
				sunAU = 13599840256
				sunlightColor = 1.0,0.55,0.48,1
				sunlightIntensity = 0.35
				scaledSunlightColor = 1.0,0.55,0.48,1
				scaledSunlightIntensity = 0.35
				IVASunColor = 1.0,0.55,0.48,1
				IVASunIntensity = 0.3
				sunLensFlareColor = 0.22,0.07,0.06,1
				ambientLightColor = 0.03,0.015,0.015,1
				// Intensidad de la luz local según la distancia: los planetas van de 2.8e7 a 2.5e8 m
				IntensityCurve
				{
					key = 0 1 0 0
					key = 100000000 0.9 0 0
					key = 300000000 0.7 0 0
					key = 2000000000 0 0 0
				}
				ScaledIntensityCurve
				{
					key = 0 1 0 0
					key = 16667 0.9 0 0
					key = 50000 0.7 0 0
					key = 333333 0 0 0
				}
				IVAIntensityCurve
				{
					key = 0 0.8 0 0
					key = 100000000 0.7 0 0
					key = 300000000 0.5 0 0
					key = 2000000000 0 0 0
				}
			}
		}
		Rings
		{
			// Tres discos, sin luz propia ni desvanecimiento por distancia (fadeoutMinAlpha = 1):
			// deben verse desde el Tracking Station. Radios en milésimas del radio de Kraken.
			// Disco interior caliente: 36 000–50 000 km (entre Krax y Scarch)
			Ring
			{
				innerRadius = 5714
				outerRadius = 7937
				angle = 0
				texture = MundosLejanos/PluginData/Kraken/Kraken_DiskInner.dds
				color = 1,1,1,1
				lockRotation = true
				unlit = true
				useNewShader = false
				fadeoutMinAlpha = 1
			}
			// Disco protoplanetario: 150 000–400 000 km, con el hueco de Ignea (250 000 km)
			Ring
			{
				innerRadius = 23810
				outerRadius = 63492
				angle = 0
				texture = MundosLejanos/PluginData/Kraken/Kraken_Disk.dds
				color = 1,1,1,1
				lockRotation = true
				unlit = true
				useNewShader = false
				fadeoutMinAlpha = 1
			}
			// Cinturón Oscuro: 450 000–820 000 km, polvo casi negro: apenas visible
			Ring
			{
				innerRadius = 71429
				outerRadius = 130159
				angle = 1.5
				texture = MundosLejanos/PluginData/Kraken/Kraken_DarkBelt.dds
				color = 1,1,1,1
				lockRotation = true
				unlit = true
				useNewShader = false
				fadeoutMinAlpha = 1
			}
		}
	}
}
