// =============================================================================
//  SALUS — océano hipersalino casi global (97 %), inundado por impactos
//  Los grandes impactos fundieron y hundieron sus continentes; solo asoman los arcos de
//  los bordes de 4 cuencas de impacto. La sal baja el punto de congelación a ~−20 °C,
//  por eso el océano sigue líquido a −5 °C en el borde exterior de la zona habitable.
//  Se creyó hiceano: el agua salada reacciona con la roca del fondo (serpentinización)
//  y libera H2; los telescopios vieron hidrógeno sobre un océano.
// =============================================================================
