// =============================================================================
//  TENEBRIS — mundo frío y oscuro con agua líquida solo en el ecuador (referencia del equipo)
//  Se conserva el diámetro (1 120 km) y la gravedad de la referencia: 2.87 m/s² (0.29 g).
//  Atmósfera tenue: 0.2 atm de metano con trazas de N2 y Ar. Sin efecto invernadero: 3 °C en
//  el ecuador, ~−67 °C en los polos. Océanos congelados en el 35 % de la superficie; solo la
//  franja ecuatorial es agua líquida. Rocas de albedo bajísimo. El metano lleva millones de años
//  aumentando: quizá haya vida metanógena en los respiraderos de la costa ecuatorial.
//  Gira (día de 36 h): con rotación síncrona el agua líquida estaría en un solo punto, no en el ecuador.
//  Asentamiento Kerbal: meseta plana a 12° N, 35° E (lista para Kerbal Konstructs).
//  Restos de la Máquina: cráter a 18° S, 140° E.
// =============================================================================
@Kopernicus:FOR[MundosLejanos]
{
	Body
	{
		name = Tenebris
		Template
		{
			name = Laythe
			removeAllPQSMods = true
		}
