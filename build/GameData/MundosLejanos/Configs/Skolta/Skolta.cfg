// =============================================================================
//  SKOLTA — "Titán cálido" entre Duna y Dres (ficha del equipo, 2026-10-11)
//  Año de 365.25 días de 24 h -> a = 30.9 Gm (~2.3 KAU), e = 0.05, i = 19°. Día de 24 h.
//  0.75 g, 650 km. Atmósfera de 4 bar: 76 % N2, 21 % NH3, 3 % CH4, con bruma orgánica naranja.
//  ~230 K de media (238 K en el ecuador, ~212 K en los polos).
//  Mar incoloro de amoníaco con hidracina (65 %, densidad ~0.75): crema en la orilla, casi negro
//  mar adentro y oscuro visto de lejos, con brillo especular. Fondo de
//  silicatos pobres en hierro: tierras altas claras de anortosita, llanuras ocre, dunas oscuras,
//  pocos campos volcánicos (con bahías azules de azufre) y yacimientos de cobre y níquel.
// =============================================================================
