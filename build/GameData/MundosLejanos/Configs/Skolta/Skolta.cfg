			description = Un mundo frío y brumoso entre Duna y Dres, del tamaño de Kerbin. Desde el espacio parece una bola naranja: una bruma orgánica, como la de Titán, lo tapa casi todo. Debajo hay un cielo de 4 atmósferas de nitrógeno con mucho amoníaco y algo de metano, a unos −45 °C. Dos tercios del planeta son un mar de amoníaco líquido con hidracina disuelta, un monopropelente natural que basta con destilar. El líquido es incoloro: en la orilla deja ver el fondo claro, mar adentro parece casi negro y, visto de lejos, refleja el naranja del cielo. Las tierras altas son de roca blanca, las llanuras ocre y, en los cinturones secos, se extienden dunas oscuras. En unos pocos campos volcánicos, el azufre tiñe las bahías de azul. El aire es tóxico y no tiene oxígeno, pero aterrizar es fácil: la atmósfera es cuatro veces más densa que la de Kerbin. Su año dura 365 días de 24 horas. Su luna, Ceniza, es una roca parda capturada del cinturón.
