// =============================================================================
//  TALIA — planeta enano del cinturón exterior, entre Dres y Jool (ficha del equipo, 28-07)
//  Ficha: 2 928 km de diámetro, 0.89 masas lunares, 1.31 m/s², atmósfera casi inexistente.
//  En KSP, a escala ÷10 como Kerbin y con la misma gravedad: R = 146.4 km, 0.134 g. a = 53 Gm (3.9 KAU).
//  Sin actividad geológica: un registro de impactos de la historia temprana del sistema. La Gran Cuenca
//  (22° S, 110° E) es un anillo triple de 220 km; en los bordes de las cuencas afloran hierro y níquel.
// =============================================================================
@Kopernicus:FOR[MundosLejanos]
{
	Body
	{
		name = Talia
		Template
		{
			name = Dres
			removeAllPQSMods = true
		}
		Properties
		{
			displayName = Talia^N
			description = El mayor cuerpo del cinturón exterior, más allá de Dres, y el segundo de los cinturones de Kerbol después de Termos. A diferencia de Termos, Talia está muerta por dentro: sin volcanes ni aire que borren las cicatrices, su superficie conserva intactos los impactos de los primeros tiempos del sistema, cráter sobre cráter. El mayor, la Gran Cuenca, es un anillo triple de 220 km con el fondo de vidrio oscuro. Los golpes más grandes rompieron la corteza y dejaron el manto a la vista: en los bordes de las cuencas afloran hierro y níquel. Junto con Termos, es uno de los grandes objetivos de la minería del sistema. Su gravedad atrae buena parte de los impactos de su cinturón.
			radius = 146400
			geeASL = 0.1336	// 1.31 m/s², la gravedad de la ficha
			rotationPeriod = 26400
			rotates = true
			tidallyLocked = false
			initialRotation = 0
			isHomeWorld = false
			timewarpAltitudeLimits = 0 10000 10000 25000 50000 100000 200000 300000
			ScienceValues
			{
				landedDataValue = 11
				splashedDataValue = 1
				flyingLowDataValue = 1
				flyingHighDataValue = 1
				inSpaceLowDataValue = 8
				inSpaceHighDataValue = 7
				recoveryValue = 9
				flyingAltitudeThreshold = 10000
				spaceAltitudeThreshold = 75000
			}
			biomeMap = MundosLejanos/PluginData/Talia/Talia_Biomes.png
			Biomes
			{
				Biome
				{
					name = Llanuras Craterizadas
					displayName = Llanuras Craterizadas
					value = 1.0
					color = #707070
				}
				Biome
				{
					name = Tierras Altas
					displayName = Tierras Altas
					value = 1.1
					color = #c0b090
				}
				Biome
				{
					name = Cuencas de Impacto
					displayName = Cuencas de Impacto
					value = 1.2
					color = #2a5a8a
				}
				Biome
				{
					name = Gran Cuenca
					displayName = Gran Cuenca
					value = 1.5
					color = #4040c0
				}
				Biome
				{
					name = Crateres Jovenes
					displayName = Cráteres Jóvenes
					value = 1.3
					color = #ffffff
				}
				Biome
				{
					name = Afloramientos Metalicos
					displayName = Afloramientos Metálicos
					value = 1.7
					color = #ff8000
				}
			}
		}
		Orbit
		{
			referenceBody = Sun
			semiMajorAxis = 53000000000	// 3.9 KAU: cinturón exterior entre Dres (apoapsis 46.8 Gm) y Jool
			eccentricity = 0.07
			inclination = 9
			longitudeOfAscendingNode = 200
			argumentOfPeriapsis = 300
			meanAnomalyAtEpoch = 1.5
			epoch = 0
			color = 0.62,0.60,0.56,1
		}
		ScaledVersion
		{
			type = Vacuum
			Material
			{
				texture = MundosLejanos/PluginData/Talia/Talia_Color.dds
				normals = MundosLejanos/PluginData/Talia/Talia_Normal.dds
				specColor = 0.04,0.04,0.04,1	// regolito mate (el PQS usa _Color, que es opaco)
				shininess = 0.3
			}
		}
		PQS
		{
			materialType = AtmosphericExtra
			allowFootprints = True
			Material
			{
				saturation = 1
				contrast = 1.2
				tintColor = 1,1,1,0
				groundTexStart = 0
				groundTexEnd = 9000
				steepTexStart = 0
				steepTexEnd = 9000
				steepTex = CTTP/Textures/PluginData/cliff.dds
				steepBumpMap = CTTP/Textures/PluginData/cliff_normal.dds
				steepNearTiling = 2500
				steepTiling = 25
				lowTex = CTTP/Textures/PluginData/gravel.dds
				lowBumpMap = CTTP/Textures/PluginData/gravel_normal.dds
				lowNearTiling = 5000
				lowMultiFactor = 50
				lowBumpNearTiling = 5000
				lowBumpFarTiling = 50
				midTex = CTTP/Textures/PluginData/cracked.dds
				midBumpMap = CTTP/Textures/PluginData/cracked_normal.dds
				midNearTiling = 7500
				midMultiFactor = 75
				midBumpNearTiling = 7500
				midBumpFarTiling = 75
				highTex = CTTP/Textures/PluginData/rock.dds
				highBumpMap = CTTP/Textures/PluginData/rock_normal.dds
				highNearTiling = 5000
				highMultiFactor = 50
				highBumpNearTiling = 5000
				highBumpFarTiling = 50
				lowStart = 0
				lowEnd = 0.3
				highStart = 0.6
				highEnd = 1
			}
			Mods
			{
				// h = offset + gris * deformity  ->  −5 500 m (fondo de la Gran Cuenca) … +5 500 m
				VertexHeightMap
				{
					map = MundosLejanos/PluginData/Talia/Talia_Height.png
					offset = -5500
					deformity = 11000
					scaleDeformityByRadius = false
					order = 10
					enabled = true
				}
				VertexSimplexHeightAbsolute
				{
					seed = 15101
					deformity = 50
					octaves = 6
					persistence = 0.5
					frequency = 40
					order = 20
					enabled = true
				}
				VertexColorMap
				{
					map = MundosLejanos/PluginData/Talia/Talia_Color.dds
					order = 50
					enabled = true
				}
			}
		}
	}
}
