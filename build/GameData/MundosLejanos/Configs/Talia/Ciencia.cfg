// =============================================================================
//  TEXTOS DE CIENCIA de Talia
//  Claves: <Cuerpo><Situación>[<Bioma sin espacios>]. validar_pack.py comprueba los biomas.
// =============================================================================
@EXPERIMENT_DEFINITION[crewReport]:FOR[MundosLejanos]
{
	@RESULTS
	{
		TaliaInSpaceHigh = Una esfera gris parda picada de cráteres de todos los tamaños. Una cicatriz enorme ocupa casi un hemisferio: la Gran Cuenca.
		TaliaInSpaceLow = Cráteres sobre cráteres sobre cráteres. Aquí y allá brillan los rayos claros de algún impacto reciente.
		TaliaSrfLanded = Un desierto gris y en silencio, sembrado de rocas. Nada ha cambiado aquí en miles de millones de años.
		TaliaSrfLandedGranCuenca = El fondo de la Gran Cuenca: una llanura de roca vitrificada, oscura y lisa. Los anillos se alzan en el horizonte como cordilleras.
		TaliaSrfLandedAfloramientosMetalicos = Rocas grises que brillan como acero bajo la luz de Kerbol. Esto no es regolito corriente.
		TaliaSrfLandedCrateresJovenes = Roca fresca y clara, con bloques sueltos por todas partes: un impacto reciente, de los pocos que se ven en Talia.
	}
}

@EXPERIMENT_DEFINITION[evaReport]:FOR[MundosLejanos]
{
	@RESULTS
	{
		TaliaSrfLanded = Con 0.13 g, cada paso levanta una nube de polvo gris que tarda en caer.
		TaliaSrfLandedAfloramientosMetalicos = El suelo pesa: las piedras son mucho más densas que en el resto de Talia.
	}
}

@EXPERIMENT_DEFINITION[surfaceSample]:FOR[MundosLejanos]
{
	@RESULTS
	{
		TaliaSrfLanded = Regolito triturado por miles de millones de años de impactos. Algunos granos son más antiguos que cualquier roca de Kerbin.
		TaliaSrfLandedGranCuenca = Vidrio de impacto: roca fundida por el golpe que abrió la cuenca. Fecharlo diría cuándo bombardearon los asteroides el sistema interior.
		TaliaSrfLandedAfloramientosMetalicos = Hierro y níquel del manto profundo, con platino y otros metales valiosos. Un yacimiento enorme a la vista.
		TaliaSrfLandedCrateresJovenes = Roca fresca, sin oscurecer por la radiación. El impacto fue hace muy poco, en términos geológicos.
	}
}

@EXPERIMENT_DEFINITION[temperatureScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		TaliaSrfLanded = −110 °C de día y bastante menos de noche. Sin atmósfera, no retiene nada.
	}
}

@EXPERIMENT_DEFINITION[seismicScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		TaliaSrfLanded = Nada. Talia está muerta por dentro: se enfrió muy pronto y desde entonces solo cambia cuando algo choca contra ella.
		TaliaSrfLandedGranCuenca = Los ecos revelan una corteza muy fina bajo la cuenca y, debajo, roca más densa: el manto quedó muy cerca de la superficie.
	}
}

@EXPERIMENT_DEFINITION[gravityScan]:FOR[MundosLejanos]
{
	@RESULTS
	{
		TaliaSrfLanded = 0.13 g. Bajo la Gran Cuenca la gravedad es algo mayor: el manto denso subió tras el impacto.
		TaliaInSpaceLow = Una de las dos grandes masas de los cinturones de Kerbol, junto con Termos. Su gravedad atrae muchos de los impactos de su zona.
	}
}
