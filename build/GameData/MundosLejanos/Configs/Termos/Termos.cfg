// =============================================================================
//  TERMOS — planeta enano activo del cinturón entre Skolta y Dres (fichas del equipo, 28-07)
//  Ficha: 4 258 km de diámetro, 2.45 masas lunares, 2.65 m/s², 5 atm de N2, CO2, H2O y NH3.
//  En KSP, a escala ÷10 como Kerbin y con la misma gravedad: R = 212.9 km, 0.27 g. a = 33.5 Gm (2.46 KAU).
//  Atmósfera de 5 atm: 55 % N2, 22 % CO2, 18 % H2O, 5 % NH3; 122 °C en el ecuador y ~95 °C en los polos.
//  Lagos de agua lechosa por la sílice, a ~140 °C (a 5 atm hierve a 152 °C), con terrazas de sínter;
//  volcanes y pozos ácidos en los trópicos. Lunas: Tyrna y Karmen (Termos/Lunas.cfg).
// =============================================================================
@Kopernicus:FOR[MundosLejanos]
{
	Body
	{
		name = Termos
		Template
		{
			name = Laythe
			removeAllPQSMods = true
		}
