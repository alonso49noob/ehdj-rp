			displayName = Norh^N
			description = Un mundo del tamaño de Kerbin que comparte órbita con Jool: es un troyano que lo sigue siempre 60° por detrás, donde la luz de Kerbol llega veinticinco veces más débil que a Kerbin. Debería estar congelado, pero su atmósfera de 12 bar de nitrógeno, hidrógeno y amoníaco atrapa el calor como una manta: en el ecuador se mantiene a unos −40 °C, y allí una banda de agua mezclada con amoníaco sigue líquida y da la vuelta al planeta. Los polos están cubiertos de hielo. No tiene cráteres: la atmósfera quema los meteoritos pequeños y los volcanes, que hay por todas partes, renuevan el suelo una y otra vez. El mayor, el Gran Volcán, se alza 9 km sobre el mar ecuatorial. Lo rodean anillos de hielo jóvenes, restos de una luna que se acercó demasiado; aún no se han asentado sobre el ecuador. Aterrizar es fácil: el aire es tan denso que los paracaídas frenan casi solos. Volver a órbita es otra historia.
			radius = 603500
			geeASL = 0.9294
			rotationPeriod = 28800
			rotates = true
			tidallyLocked = false
			initialRotation = 0
			isHomeWorld = false
			timewarpAltitudeLimits = 0 138000 138000 170000 340000 680000 1360000 2720000
