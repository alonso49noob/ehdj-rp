// =============================================================================
//  NORH — mundo rocoso helado, troyano de Jool (L5: lo sigue 60° por detrás, a 5.06 KAU de Kerbol)
//  0.94 masas de Kerbin, 1 207 km de diámetro (g = 0.93). Atmósfera de 12 bar:
//  45 % N2, 23 % H2, 32 % NH3. El invernadero por colisiones H2–N2 lo mantiene a −40 °C en el
//  ecuador, donde una banda de agua con un ~25 % de amoníaco sigue líquida; los polos están helados.
//  Superficie sin cráteres (la atmósfera quema los impactores pequeños y los volcanes
//  rejuvenecen el suelo), con decenas de volcanes y el Gran Volcán, una isla de 9 km de altura
//  en el mar ecuatorial (8° N, 50° O). Anillos de hielo jóvenes, aún inclinados 20°.
// =============================================================================
@Kopernicus:FOR[MundosLejanos]
{
	Body
	{
		name = Norh
		Template
		{
			name = Laythe
			removeAllPQSMods = true
		}
