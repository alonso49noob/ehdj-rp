// =============================================================================
//  HALUM — mundo de hidrógeno (99 % H, 1 % Ne en masa) con océano de neón y 7 atm
//  Compañero binario de Creus, a 5 KAU. Radio medido en la imagen (57.2 px -> 690 km).
//  Física (docs/DISENO.md): el neón es líquido a 7 atm y ~32 K; por debajo de ~310 m
//  la presión supera su punto crítico (27 atm) y, con el calor interno, el océano se
//  vuelve supercrítico: no tiene fondo definido, se funde en fluido.
// =============================================================================
