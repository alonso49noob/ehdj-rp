// =============================================================================
//  ANTENA DE RELÉ DE ESPACIO PROFUNDO
//  A 800 KAU (1.09e13 m) ninguna antena instalada llega: la más potente (5e11 m)
//  da ~37 KAU de relé a relé. Este clon del RA-100 llega a 2e13 m de relé a relé:
//  una pareja (una en órbita de Kerbin, otra en el sistema de Creus) enlaza ambos
//  sistemas con ~40 % de señal en el afelio (1.12e13 m).
//  Se clona en :LAST para heredar el modelo de ReStock si está instalado.
// =============================================================================
+PART[RelayAntenna100]:NEEDS[!RemoteTech]:LAST[MundosLejanos]
{
	@name = MundosLejanos_RelayProfundo
	@title = RA-K Relé de Espacio Profundo
	@description = Un RA-100 ampliado, con amplificadores criogénicos y un plato que se despliega a varias veces su tamaño. Hace falta un par: uno junto a Kerbin y otro en el sistema de Creus. No se garantiza la cobertura dentro de una atmósfera de hidrógeno de 7 atm.
	@TechRequired = largeUnmanned
	@entryCost = 90000
	@cost = 28000
	@mass = 2.4
	@rescaleFactor = 1.6
	@MODULE[ModuleDataTransmitter]
	{
		@antennaPower = 20000000000000
		@packetResourceCost = 150
	}
}
